name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Fence SpecialPower file and reproduce ABI-correct source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,re,subprocess,sys,csv
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          token='aa5f5dd9fe527612c8822631aa18d149b5e47239'
          assert claims.fetch()
          current=claims.live(claims._read_local())
          for rva in [0x00269C50,0x00271B40]:
              entry=current.get(rva)
              assert entry and entry[0]==token and entry[1]['owner']==os.environ['BFME_CLAIM_OWNER'] and entry[1]['lease']=='5d82ccfbf2544ed0b704840d11b13543'
              assert claims.holds(rva,token)
          for old in [0x001EDCA0,0x00925D10,0x00948BD0]: assert old not in current
          print('CLAIM_CLUSTER_FENCED_OLD_RELEASED',flush=True)
          out=Path('build/contributor_hard_finish_sp_20261025');out.mkdir(parents=True,exist_ok=True)
          targets={0x00269C50,0x00271B40,0x0039B6D0}
          for rva,size in [(0x00269C50,1073),(0x00271B40,249)]:
              p=subprocess.run([sys.executable,'tools/callees.py',hex(rva),str(size)],capture_output=True,text=True)
              print(p.stdout,flush=True);print(p.stderr,flush=True);assert p.returncode==0
              targets.update(int(v,16) for v in re.findall(r'->\s*(0x[0-9a-fA-F]+)',p.stdout))
              for line in Path('targets/game/reverse/re_attempts.log').read_text(encoding='utf-8',errors='replace').splitlines():
                  if ('0x%08x'%rva) in line.lower(): print('TARGET_HISTORY '+line,flush=True)
          for folder in ('targets/game/reverse/attempt_support','targets/game/reverse/identity_evidence'):
              for path in Path(folder).rglob('*.md'):
                  text=path.read_text(encoding='utf-8',errors='replace')
                  if any(('%08x'%rva) in text.lower() for rva in [0x00269C50,0x00271B40]):
                      print('TARGET_REPORT '+str(path)+' '+subprocess.check_output(['git','hash-object',str(path)],text=True).strip(),flush=True)
          with open('targets/game/reverse/functions.csv',newline='',encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  if row.get('target_rva') and int(row['target_rva'],16) in targets:
                      print('NARROW_CALLEE_LEDGER '+json.dumps(row),flush=True)
          cases=[
           ('sp-wrong-abi-diagnostic','targets/game/reverse/attempts/0x00269c50.cpp','?finishSpecialPower@SpecialPowerModule@@QAEXI@Z','0x00269C50',1073),
           ('sp-correct-abi','targets/game/reverse/attempt_support/0x00269c50-20261013-formB-constref-abi.inc','?finishSpecialPower@SpecialPowerModule@@QAEXI@Z','0x00269C50',1073),
           ('sync-executable-body','targets/game/reverse/attempts/0x00271b40.cpp','?bfmeSyncEGF@BfmeThingEGF@@QAEXXZ','0x00271B40',249)]
          for name,path,symbol,rva,size in cases:
              assert claims.holds(int(rva,16),token)
              private=out/(name+'.cpp');private.write_text(Path(path).read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
              p=subprocess.run([sys.executable,'tools/probe.py',str(private),symbol,rva,'--size',str(size),'--shape'],capture_output=True,text=True)
              log=p.stdout+'\n'+p.stderr;(out/(name+'.log')).write_text(log,encoding='utf-8')
              print('TARGET_PROBE '+name,flush=True);print(log,flush=True)
              assert p.returncode==0
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-specialpower-baselines
          path: |
            source/build/contributor_hard_finish_sp_20261025/
            source/build/experiments/
          retention-days: 90
