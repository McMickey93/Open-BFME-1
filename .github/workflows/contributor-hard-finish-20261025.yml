name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Measure faithful non-expanding provider visibility
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          token='aa5f5dd9fe527612c8822631aa18d149b5e47239'
          assert claims.fetch()
          current=claims.live(claims._read_local())
          for rva in [0x00269C50,0x00271B40]:
              e=current.get(rva)
              assert e and e[0]==token and e[1]['owner']==os.environ['BFME_CLAIM_OWNER'] and e[1]['lease']=='5d82ccfbf2544ed0b704840d11b13543'
              assert claims.holds(rva,token)
          out=Path('build/contributor_hard_finish_sp_visibility_20261025');out.mkdir(parents=True,exist_ok=True)
          base=Path('targets/game/reverse/attempt_support/0x00269c50-20261013-formB-constref-abi.inc').read_text(encoding='utf-8')
          base=base[base.index('#include'):]
          ascii_def=r'''
          template<class T> class StringBase {
              friend class AsciiString;
              friend class UnicodeString;
          public: void set(const StringBase<T>&);
          private: void releaseBuffer();
          };
          class AsciiString {
          public:
              AsciiString &operator=(const AsciiString &other) { ((StringBase<char> *)this)->set(*(const StringBase<char> *)&other); return *this; }
              void set(const char*,int);
          private: char *m_data;
          };
          class Team { public: Player *getControllingPlayer() const; };
          '''
          base=base.replace('class AsciiString;',ascii_def)
          base=base.replace('\nclass BfmeObjectReferenceStore\n', '\nextern const char g_Rva0107301CEmptyString[];\nclass BfmeObjectReferenceStore\n')
          base=base.replace('void subtract(Int);','void subtract(Int);\nprivate: unsigned char m_pad[0x278]; int m_value;')
          base=base.replace('Player *getControllingPlayer() const;\n\tvoid setDisabledUntil','Player *getControllingPlayer() const;\n\tvoid setDisabledUntil')
          base=base.replace('\n};\n\nclass GameLogic\n','\npublic:\n    unsigned char m_nextPad[0x88 - 8];\n    Object *m_nextObject;\n};\n\nclass GameLogic\n')
          base=base.replace('class GameLogic\n{\npublic:','class GameLogic\n{\npublic:\n    Object *getFirstObject();')
          start=base.index('class BfmeObjectReferenceStore\n')
          end=base.index('\nclass BfmeModeGF;',start)
          store_decl=r'''class BfmeObjectReferenceStore
          {
          public:
              void clearObjectEntries();
              void updateObjectReference(Object *object, bool adding);
              void configure(Int mode, const Int &value, const Object *player,
                  const AsciiString &name, Int trailingValue);
          private:
              unsigned char m_pad[0x14];
              Int m_mode;
              unsigned char m_pad2[4];
              AsciiString m_name;
              Int m_value;
              unsigned short m_mask;
          };
          '''
          base=base[:start]+store_decl+base[end:]
          configure_decl='void configure(Int mode, const Int &value, const Object *player,\n        const AsciiString &name, Int trailingValue);'
          configure_body=r'''__declspec(noinline) void configure(Int mode, const Int &value, const Object *player,
                  const AsciiString &name, Int trailingValue)
              {
                  clearObjectEntries();
                  m_mode = mode;
                  *(int *)(m_pad2) = value;
                  m_name = name;
                  m_value = trailingValue;
                  m_mask = (unsigned short)(1 << *(const int *)((const unsigned char *)player + 0x24));
                  Object *object = TheGameLogic->getFirstObject();
                  while (object != 0) {
                      updateObjectReference(object, false);
                      object = object->m_nextObject;
                  }
              }'''
          clear_body=r'''__declspec(noinline) void clearObjectEntries()
              {
                  Object *object = TheGameLogic->getFirstObject();
                  while (object != 0) {
                      updateObjectReference(object, true);
                      object = object->m_nextObject;
                  }
                  m_mode=0;
                  m_name.set(g_Rva0107301CEmptyString,0);
                  m_value=0;
                  m_mask=0;
              }'''
          subtract_body=r'''__declspec(noinline) void subtract(Int amount)
              {
                  m_value -= amount;
                  if (m_value < 0) m_value=0;
              }'''
          player_body=r'''__declspec(noinline) Player *getControllingPlayer() const
              {
                  struct BFMEObjectTeamField { unsigned char pad[0x23c]; Team *team; };
                  const BFMEObjectTeamField *self=reinterpret_cast<const BFMEObjectTeamField *>(this);
                  return self->team ? self->team->getControllingPlayer() : 0;
              }'''
          cases=[
          ('native-layout-control',base,[]),
          ('configure-visible',base.replace(configure_decl,configure_body),[('?configure@BfmeObjectReferenceStore@@QAEXHABHPBVObject@@ABVAsciiString@@H@Z','0x0039B6D0',105)]),
          ('configure-clear-visible',base.replace(configure_decl,configure_body).replace('void clearObjectEntries();',clear_body),[('?configure@BfmeObjectReferenceStore@@QAEXHABHPBVObject@@ABVAsciiString@@H@Z','0x0039B6D0',105),('?clearObjectEntries@BfmeObjectReferenceStore@@QAEXXZ','0x0039B660',79)]),
          ('subtract-visible',base.replace('void subtract(Int);',subtract_body),[('?subtract@Rva000C98C0@@QAEXH@Z','0x000C98C0',33)]),
          ('controlling-player-visible',base.replace('Player *getControllingPlayer() const;\n\tvoid setDisabledUntil',player_body+'\n\tvoid setDisabledUntil'),[('?getControllingPlayer@Object@@QBEPAVPlayer@@XZ','0x001BE3F0',18)]),
          ('all-three-visible',base.replace(configure_decl,configure_body).replace('void subtract(Int);',subtract_body).replace('Player *getControllingPlayer() const;\n\tvoid setDisabledUntil',player_body+'\n\tvoid setDisabledUntil'),[('?configure@BfmeObjectReferenceStore@@QAEXHABHPBVObject@@ABVAsciiString@@H@Z','0x0039B6D0',105),('?subtract@Rva000C98C0@@QAEXH@Z','0x000C98C0',33),('?getControllingPlayer@Object@@QBEPAVPlayer@@XZ','0x001BE3F0',18)])]
          def probe(name,private,symbol,rva,size,provider=False):
              p=subprocess.run([sys.executable,'tools/probe.py',str(private),symbol,rva,'--size',str(size),'--shape'],capture_output=True,text=True)
              log=p.stdout+'\n'+p.stderr
              (out/(name+'.log')).write_text(log,encoding='utf-8',newline='\n')
              print('VISIBILITY_PROBE '+name,flush=True);print(log,flush=True)
              return p.returncode==0 and ('diffs    0 non-reloc' in log or 'diffs    0 ' in log)
          for name,src,providers in cases:
              assert claims.holds(0x00269C50,token)
              private=out/(name+'.cpp');private.write_text('// cl: /DNDEBUG /MD /EHsc\n// stlport\n'+src,encoding='utf-8',newline='\n')
              good=True
              for symbol,rva,size in providers:
                  good=probe(name+'-provider-'+rva,private,symbol,rva,size,True) and good
              print('PROVIDER_STRICT_RESULT '+name+' '+str(good),flush=True)
              probe(name+'-caller',private,'?finishSpecialPower@SpecialPowerModule@@QAEXI@Z','0x00269C50',1073)
          sync=Path('targets/game/reverse/attempts/0x00271b40.cpp').read_text(encoding='utf-8')
          vdispatch='class VDispatch2 { public:\n'+''.join('virtual void v%d(int,int);\n'%i for i in range(84))+'};\nstruct HolderRva004141A0GuardedVCall { VDispatch2 *m_first; };\n'
          old='class Rva004141A0GuardedVCall\n{\npublic:\n\tvoid forward(int a0, int a1);\n};'
          new=vdispatch+r'''class Rva004141A0GuardedVCall
          {
          public:
              __declspec(noinline) void forward(int a0,int a1)
              {
                  HolderRva004141A0GuardedVCall *holder=m_holder;
                  if (holder->m_first != 0) holder->m_first->v24(a0,a1);
              }
              char m_lead[0x150];
              HolderRva004141A0GuardedVCall *m_holder;
          };'''
          assert old in sync
          assert claims.holds(0x00271B40,token)
          private=out/'sync-terminal-forwarder-visible.cpp';private.write_text(sync.replace(old,new),encoding='utf-8',newline='\n')
          probe('sync-forwarder-provider',private,'?forward@Rva004141A0GuardedVCall@@QAEXHH@Z','0x004141A0',20)
          probe('sync-forwarder-caller',private,'?bfmeSyncEGF@BfmeThingEGF@@QAEXXZ','0x00271B40',249)
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-specialpower-visibility
          path: |
            source/build/contributor_hard_finish_sp_visibility_20261025/
            source/build/experiments/
          retention-days: 90
