name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Measure native typed base-offset field and verified normal Render visibility
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          token='06d3feefd48097e4ef5129b93418d632502181df'
          assert claims.fetch()
          entry=claims.live(claims._read_local()).get(0x00948BD0)
          assert entry and entry[0]==token and entry[1]['lease']=='a5a918136da04d4e80801a1a798fe459'
          assert claims.holds(0x00948BD0,token)
          out=Path('build/contributor_hard_finish_dx8_20261025');out.mkdir(parents=True,exist_ok=True)
          source=Path('targets/game/reverse/attempts/0x00948bd0.cpp').read_text(encoding='utf-8')
          rawgetter='int Get_Base_Vertex_Offset() const { return *(const int*)((const char*)this+0x304); }'
          assert source.count(rawgetter)==1
          meshend='    Rva00948BD0Field314 *Field314() const { return *(Rva00948BD0Field314*const*)((const char*)this+0x314); }\n\n};'
          assert source.count(meshend)==1
          withfield=source.replace(meshend,meshend[:-3]+'    char typed_pad[0x304-sizeof(RefCountClass)];\n    int BaseVertexOffset;\n};\n#include <stddef.h>\ntypedef char CheckBaseSize[(sizeof(RefCountClass)==8)?1:-1];\ntypedef char CheckBaseField[(offsetof(Rva00948BD0Mesh,BaseVertexOffset)==0x304)?1:-1];')
          variants={
           'base-getter-nonconst':source.replace(rawgetter,rawgetter.replace('() const','()')),
           'base-getter-typed-const':withfield.replace(rawgetter,'int Get_Base_Vertex_Offset() const { return BaseVertexOffset; }'),
           'base-getter-typed-native':withfield.replace(rawgetter,'int Get_Base_Vertex_Offset() { return BaseVertexOffset; }'),
          }
          method='    void Render(int);'
          fields='    MeshModelClass *mmc; DX8TextureCategoryClass *category; unsigned field10; unsigned field14; unsigned field18; unsigned field1c; unsigned field20;'
          assert source.count(method)==1 and source.count(fields)==1
          extra=' unsigned min_vertex_index2; unsigned vertex_index_range2; bool strip; unsigned pass;'
          renderbody='''    __declspec(noinline) void Render(int base) {
                  DX8Wrapper::Set_Index_Buffer_Index_Offset(base);
                  if (strip) DX8Wrapper::Draw_Strip(field10,field18-2,field1c,field20);
                  else DX8Wrapper::Draw_Triangles(field10,field18/3,field1c,field20);
              }'''
          visible=source.replace(method,renderbody).replace(fields,fields+extra)
          variants['unsorted-render-visible-noinline']=visible
          variants['typed-base-and-visible-noinline']=variants['base-getter-typed-native'].replace(method,renderbody).replace(fields,fields+extra)
          import hashlib
          results=[]
          for name,candidate in variants.items():
              assert claims.holds(0x00948BD0,token)
              path=out/(name+'.cpp');path.write_text(candidate,encoding='utf-8')
              print('TRIAL_BEGIN '+name+' source_sha256='+hashlib.sha256(candidate.encode()).hexdigest(),flush=True)
              item={'name':name,'sha256':hashlib.sha256(candidate.encode()).hexdigest()}
              if 'visible-noinline' in name:
                  p=subprocess.run([sys.executable,'tools/probe.py',str(path),'?Render@DX8PolygonRendererClass@@QAEXH@Z','0x0092CB30','--shape'],capture_output=True,text=True)
                  log=p.stdout+'\n'+p.stderr
                  (out/(name+'-provider.log')).write_text(log,encoding='utf-8')
                  print('PROVIDER_CHECK '+name,flush=True);print(log,flush=True)
                  item['provider_exact']='result   EXACT' in log
                  if p.returncode or not item['provider_exact']:
                      print('PROVIDER_NOT_VERIFIED_SKIP_CALLER',flush=True)
                      results.append(item);continue
              p=subprocess.run([sys.executable,'tools/probe.py',str(path),'?Render@DX8TextureCategoryClass@@QAEXXZ','0x00948BD0','--shape'],capture_output=True,text=True)
              log=p.stdout+'\n'+p.stderr
              (out/(name+'.log')).write_text(log,encoding='utf-8')
              print(log,flush=True)
              item['exit']=p.returncode;item['exact']='result   EXACT' in log
              results.append(item)
              assert p.returncode==0
              if item['exact']:
                  print('EXACT_CANDIDATE '+name,flush=True);print(candidate,flush=True);break
          (out/'native-field-visibility-trials.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-dx8-native-context
          path: |
            source/build/contributor_hard_finish_dx8_20261025/
            source/build/experiments/
          retention-days: 90
