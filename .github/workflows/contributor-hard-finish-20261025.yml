          cases=[["float_coord3d_contiguous","// ?blockedSpeed@Rva0026EED0AIUpdate@@QBEMPAVObject@@@Z\n// partial score=0.72 date=2026-09-26\n// cl: /DNDEBUG /MD /EHsc\n// This is the AI collision-speed calculation analogous to the Zero Hour\n// blocked-speed formula, with BFME's locomotor-height term replacing the\n// upstream physics-velocity walk.\ntypedef float Real;\nextern const Real BfmeZeroRange;\nextern Real g_bfmeDefaultBU;\nextern \"C\" double __cdecl sqrt(double value);\n#pragma intrinsic(sqrt)\n\nstruct Coord3D { Real x, y, z; };\nstruct Rva0026EED0Direction2D { Real x, y; };\nclass Thing\n{\npublic:\n\tconst Coord3D *getUnitDirectionVector2D() const;\n\tchar m_pad00[0x38];\n\tCoord3D m_position;\n\tchar m_pad44[0x31c - 0x44];\n\tint m_formation;\n};\nclass Object : public Thing\n{\npublic:\n\tReal bfmeGetNonnegativePreferredLocomotorHeight() const;\n};\nclass Rva0026EED0AIUpdate\n{\npublic:\n\tReal blockedSpeed(Object *other) const;\n\tchar m_pad00[8];\n\tObject *m_object;\n\tchar m_pad0c[0x170 - 0x0c];\n\tReal m_curMaxBlockedSpeed;\n};\nReal Rva0026EED0AIUpdate::blockedSpeed(Object *other) const\n{\n\tconst Coord3D *direction = m_object->getUnitDirectionVector2D();\n\tCoord3D ourDir;\n\tourDir.x = direction->x; ourDir.y = direction->y;\n\tconst Coord3D *otherDirection = other->getUnitDirectionVector2D();\n\tRva0026EED0Direction2D otherDir = { otherDirection->x, otherDirection->y };\n\tRva0026EED0Direction2D vectorToOther;\n\tvectorToOther.x = other->m_position.x - m_object->m_position.x;\n\tvectorToOther.y = other->m_position.y - m_object->m_position.y;\n\tReal length = (Real)sqrt(vectorToOther.x * vectorToOther.x + vectorToOther.y * vectorToOther.y);\n\tif (length != BfmeZeroRange)\n\t{\n\t\tReal reciprocal = g_bfmeDefaultBU / length;\n\t\tvectorToOther.x *= reciprocal;\n\t\tvectorToOther.y *= reciprocal;\n\t}\n\tReal dotProduct = vectorToOther.x * otherDir.x + vectorToOther.y * otherDir.y;\n\tif (dotProduct < BfmeZeroRange)\n\t\treturn BfmeZeroRange;\n\tReal speedFactor = dotProduct;\n\tReal awaySpeed = other->bfmeGetNonnegativePreferredLocomotorHeight() * speedFactor;\n\tdotProduct = vectorToOther.x * ourDir.x + vectorToOther.y * ourDir.y;\n\tif (dotProduct <= BfmeZeroRange)\n\t\treturn m_curMaxBlockedSpeed;\n\tReal maxSpeed = awaySpeed / dotProduct;\n\tif (other->m_formation != 0 && m_object->m_formation == other->m_formation)\n\t\tmaxSpeed *= 0.55f;\n\tif (maxSpeed > m_curMaxBlockedSpeed)\n\t\treturn m_curMaxBlockedSpeed;\n\treturn maxSpeed;\n}\n"],["float_coord3d_contiguous_commuted","// ?blockedSpeed@Rva0026EED0AIUpdate@@QBEMPAVObject@@@Z\n// partial score=0.72 date=2026-09-26\n// cl: /DNDEBUG /MD /EHsc\n// This is the AI collision-speed calculation analogous to the Zero Hour\n// blocked-speed formula, with BFME's locomotor-height term replacing the\n// upstream physics-velocity walk.\ntypedef float Real;\nextern const Real BfmeZeroRange;\nextern Real g_bfmeDefaultBU;\nextern \"C\" double __cdecl sqrt(double value);\n#pragma intrinsic(sqrt)\n\nstruct Coord3D { Real x, y, z; };\nstruct Rva0026EED0Direction2D { Real x, y; };\nclass Thing\n{\npublic:\n\tconst Coord3D *getUnitDirectionVector2D() const;\n\tchar m_pad00[0x38];\n\tCoord3D m_position;\n\tchar m_pad44[0x31c - 0x44];\n\tint m_formation;\n};\nclass Object : public Thing\n{\npublic:\n\tReal bfmeGetNonnegativePreferredLocomotorHeight() const;\n};\nclass Rva0026EED0AIUpdate\n{\npublic:\n\tReal blockedSpeed(Object *other) const;\n\tchar m_pad00[8];\n\tObject *m_object;\n\tchar m_pad0c[0x170 - 0x0c];\n\tReal m_curMaxBlockedSpeed;\n};\nReal Rva0026EED0AIUpdate::blockedSpeed(Object *other) const\n{\n\tconst Coord3D *direction = m_object->getUnitDirectionVector2D();\n\tCoord3D ourDir;\n\tourDir.x = direction->x; ourDir.y = direction->y;\n\tconst Coord3D *otherDirection = other->getUnitDirectionVector2D();\n\tRva0026EED0Direction2D otherDir = { otherDirection->x, otherDirection->y };\n\tRva0026EED0Direction2D vectorToOther;\n\tvectorToOther.x = other->m_position.x - m_object->m_position.x;\n\tvectorToOther.y = other->m_position.y - m_object->m_position.y;\n\tReal length = (Real)sqrt(vectorToOther.x * vectorToOther.x + vectorToOther.y * vectorToOther.y);\n\tif (length != BfmeZeroRange)\n\t{\n\t\tReal reciprocal = g_bfmeDefaultBU / length;\n\t\tvectorToOther.x *= reciprocal;\n\t\tvectorToOther.y *= reciprocal;\n\t}\n\tReal dotProduct = otherDir.x * vectorToOther.x + otherDir.y * vectorToOther.y;\n\tif (dotProduct < BfmeZeroRange)\n\t\treturn BfmeZeroRange;\n\tReal speedFactor = dotProduct;\n\tReal awaySpeed = other->bfmeGetNonnegativePreferredLocomotorHeight() * speedFactor;\n\tdotProduct = ourDir.x * vectorToOther.x + ourDir.y * vectorToOther.y;\n\tif (dotProduct <= BfmeZeroRange)\n\t\treturn m_curMaxBlockedSpeed;\n\tReal maxSpeed = awaySpeed / dotProduct;\n\tif (other->m_formation != 0 && m_object->m_formation == other->m_formation)\n\t\tmaxSpeed *= 0.55f;\n\tif (maxSpeed > m_curMaxBlockedSpeed)\n\t\treturn m_curMaxBlockedSpeed;\n\treturn maxSpeed;\n}\n"],["float_coord3d_contiguous_normalize","// ?blockedSpeed@Rva0026EED0AIUpdate@@QBEMPAVObject@@@Z\n// partial score=0.72 date=2026-09-26\n// cl: /DNDEBUG /MD /EHsc\n// This is the AI collision-speed calculation analogous to the Zero Hour\n// blocked-speed formula, with BFME's locomotor-height term replacing the\n// upstream physics-velocity walk.\ntypedef float Real;\nextern const Real BfmeZeroRange;\nextern Real g_bfmeDefaultBU;\nextern \"C\" double __cdecl sqrt(double value);\n#pragma intrinsic(sqrt)\n\nstruct Coord3D { Real x, y, z; };\nstruct Rva0026EED0Direction2D { Real x, y; void normalize() { Real length=(Real)sqrt(x*x+y*y); if(length!=BfmeZeroRange) {Real reciprocal=g_bfmeDefaultBU/length; x*=reciprocal; y*=reciprocal;} } };\nclass Thing\n{\npublic:\n\tconst Coord3D *getUnitDirectionVector2D() const;\n\tchar m_pad00[0x38];\n\tCoord3D m_position;\n\tchar m_pad44[0x31c - 0x44];\n\tint m_formation;\n};\nclass Object : public Thing\n{\npublic:\n\tReal bfmeGetNonnegativePreferredLocomotorHeight() const;\n};\nclass Rva0026EED0AIUpdate\n{\npublic:\n\tReal blockedSpeed(Object *other) const;\n\tchar m_pad00[8];\n\tObject *m_object;\n\tchar m_pad0c[0x170 - 0x0c];\n\tReal m_curMaxBlockedSpeed;\n};\nReal Rva0026EED0AIUpdate::blockedSpeed(Object *other) const\n{\n\tconst Coord3D *direction = m_object->getUnitDirectionVector2D();\n\tCoord3D ourDir;\n\tourDir.x = direction->x; ourDir.y = direction->y;\n\tconst Coord3D *otherDirection = other->getUnitDirectionVector2D();\n\tRva0026EED0Direction2D otherDir = { otherDirection->x, otherDirection->y };\n\tRva0026EED0Direction2D vectorToOther;\n\tvectorToOther.x = other->m_position.x - m_object->m_position.x;\n\tvectorToOther.y = other->m_position.y - m_object->m_position.y;\n\tvectorToOther.normalize();\n\tReal dotProduct = vectorToOther.x * otherDir.x + vectorToOther.y * otherDir.y;\n\tif (dotProduct < BfmeZeroRange)\n\t\treturn BfmeZeroRange;\n\tReal speedFactor = dotProduct;\n\tReal awaySpeed = other->bfmeGetNonnegativePreferredLocomotorHeight() * speedFactor;\n\tdotProduct = vectorToOther.x * ourDir.x + vectorToOther.y * ourDir.y;\n\tif (dotProduct <= BfmeZeroRange)\n\t\treturn m_curMaxBlockedSpeed;\n\tReal maxSpeed = awaySpeed / dotProduct;\n\tif (other->m_formation != 0 && m_object->m_formation == other->m_formation)\n\t\tmaxSpeed *= 0.55f;\n\tif (maxSpeed > m_curMaxBlockedSpeed)\n\t\treturn m_curMaxBlockedSpeed;\n\treturn maxSpeed;\n}\n"]]
          for label,code in cases:
              p=out/(label+'.cpp');p.write_text(code,encoding='utf-8')
              isfloat=label.startswith('float_')
              symbol='?blockedSpeed@Rva0026EED0AIUpdate@@QBEMPAVObject@@@Z' if isfloat else '?m00267B10@Rva00267B10@@QAEXE@Z'
              rva='0x0026EED0' if isfloat else '0x00267B10'
              size='289' if isfloat else '390'
              cmd=[sys.executable,'tools/probe.py',str(p),symbol,rva,'--size',size,'--all']
              r=subprocess.run(cmd,capture_output=True,text=True);(out/(label+'.log')).write_text(r.stdout+'\n'+r.stderr,encoding='utf-8')
              print('NEW_DONOR_PROBE '+label+' rc='+str(r.returncode)+'\n'+r.stdout+'\n'+r.stderr,flush=True)
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-float-combination-20261025
          path: |
            source/build/contributor_hard_finish_float_combination_20261025/
            source/build/experiments/
          retention-days: 90
