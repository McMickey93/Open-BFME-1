name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Inspect current project eligibility and canonical override-provider route before a new claim
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims,eligibility,build
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          assert claims.fetch()
          rva=0x00267B10
          rows=[r for r in eligibility.open_dumps() if int(r['target_rva'],16)==rva]
          assert len(rows)==1
          row=rows[0];assert row['source']=='game/gen_asm/d_00266ef0.asm'
          live=claims.live(claims._read_local());assert rva not in live,live.get(rva)
          print('CURRENT_WHOLEFILE '+json.dumps([r for r in eligibility.open_dumps() if r['source']==row['source']]),flush=True)
          subprocess.run([sys.executable,'tools/brief.py','--rvas','0x00267B10'],check=True)
          subprocess.run([sys.executable,'tools/callees.py','0x00267B10','390'],check=True)
          subprocess.run([sys.executable,'tools/callees.py','0x00087A80','26'],check=True)
          cs=Cs(CS_ARCH_X86,CS_MODE_32)
          for addr,size in [(0x00087A80,26),(0x000022BB,5)]:
              body=bytes(build.read_target_bytes(addr,size))
              print('OVER_PROVIDER_RETAIL '+hex(addr)+' '+body.hex()+' '+json.dumps([f'{i.address:08X} {i.mnemonic} {i.op_str}' for i in cs.disasm(body,addr)]),flush=True)
          base=subprocess.check_output(['git','rev-parse','origin/master'],text=True).strip()
          expected=claims._branch_sha(rva)
          marker=claims._record(os.environ['BFME_CLAIM_OWNER'],4,note='New untried canonical Overridable getFinalOverride visibility after full-file evidence bank75533e550; only00267B10 reopened, other three siblings already banked')
          record=json.loads(subprocess.check_output(['git','show','-s','--format=%B',marker],text=True))
          print('OVER_VISIBILITY_CLAIM_TRANSPORT '+json.dumps({'rvas':['0x00267B10'],'expected':expected,'record':record,'base':base,'tree':'4b825dc642cb6eb9a060e54bf8d69288fbee4904'}),flush=True)
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-overridable-claim-20261026
          path: |
            source/build/contributor_hard_finish_remaining_bank_20261025/
            source/build/experiments/
          retention-days: 90
