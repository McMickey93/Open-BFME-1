name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Fence claim and test evidenced early object-mask context
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          rva=0x001EDCA0
          token='910b0d6b2329fa9bd666f48eb0947a66564c15ba'
          assert claims.fetch()
          entry=claims.live(claims._read_local()).get(rva)
          assert entry and entry[0]==token and entry[1]['owner']==os.environ['BFME_CLAIM_OWNER']
          assert claims.holds(rva,token)
          print('CLAIM_FENCED '+json.dumps(entry),flush=True)
          subprocess.run([sys.executable,'tools/callees.py','0x001EDCA0','1944'],check=True)
          subprocess.run([sys.executable,'tools/find_declared_unmatched.py','game/GameEngine/Source/GameLogic/Object/Behavior/AutoAbilityBehaviorModuleDataDestructorThunk.cpp'],check=False)
          for line in Path('targets/game/reverse/re_attempts.log').read_text(encoding='utf-8',errors='replace').splitlines():
              if '001edca0' in line.lower():
                  print('TARGET_HISTORY '+line,flush=True)
          reports=[]
          for folder in ('targets/game/reverse/attempt_support','targets/game/reverse/identity_evidence'):
              for path in Path(folder).rglob('*.md'):
                  text=path.read_text(encoding='utf-8',errors='replace')
                  if '001edca0' in text.lower():
                      reports.append(path)
                      print('TARGET_REPORT '+str(path),flush=True)
                      print(text,flush=True)
          assert [p.as_posix() for p in reports] == ['targets/game/reverse/identity_evidence/pin-candidates-op1-batch4-oracle.md'], 'New target reports require review'
          assert subprocess.check_output(['git','hash-object',str(reports[0])],text=True).strip() == 'cb20531adcdfc4a09e9907dba0299b84e3b0a15c', 'Reviewed identity report changed'
          p=subprocess.run([sys.executable,'tools/probe.py','targets/game/reverse/attempts/0x001edca0.cpp','?update@AutoAbilityBehavior@@UAE?AW4UpdateSleepTime@@XZ','0x001EDCA0','--all','--shape'],capture_output=True,text=True)
          out=Path('build/contributor_hard_finish_20261025');out.mkdir(parents=True,exist_ok=True)
          (out/'preferred-probe.log').write_text(p.stdout+'\n'+p.stderr,encoding='utf-8')
          print(p.stdout,flush=True); print(p.stderr,flush=True)
          assert p.returncode==0
          
          source=Path('targets/game/reverse/attempts/0x001edca0.cpp').read_text(encoding='utf-8')
          expression='((Rva001ED9A0Mask *)&object->m_110)->intersects(mask.words)'
          assert source.count(expression)==1
          anchor='UpdateSleepTime AutoAbilityBehavior::update()'
          assert source.count(anchor)==1
          state_expression='(object->m_110.words[6] >> 11) & 1'
          assert source.count(state_expression)==1
          helpers={
           'object-mask':('static inline bool testForbidden001EDCA0(const Object *object, const MaskWords001EDCA0 &mask) { return ((Rva001ED9A0Mask *)&object->m_110)->intersects(mask.words); }\n','testForbidden001EDCA0(object, mask)'),
           'mask-object':('static inline bool testForbidden001EDCA0(const MaskWords001EDCA0 &mask, const Object *object) { return ((Rva001ED9A0Mask *)&object->m_110)->intersects(mask.words); }\n','testForbidden001EDCA0(mask, object)'),
           'receiver-words-control':('static inline bool testForbidden001EDCA0(Rva001ED9A0Mask *receiver, const UInt *words) { return receiver->intersects(words); }\n','testForbidden001EDCA0((Rva001ED9A0Mask *)&object->m_110, mask.words)'),
          }
          variants={}
          for name,(helper,replacement) in helpers.items():
              variants[name]=source.replace(expression,replacement).replace(anchor,helper+'\n'+anchor)
          state_helper='static inline UInt state001EDCA0(const Object *object) { return (object->m_110.words[6] >> 11) & 1; }\n'
          variants['object-state']=source.replace(state_expression,'state001EDCA0(object)').replace(anchor,state_helper+'\n'+anchor)
          variants['object-mask-and-state']=variants['object-mask'].replace(state_expression,'state001EDCA0(object)').replace(anchor,state_helper+'\n'+anchor)
          variants['mask-object-and-state']=variants['mask-object'].replace(state_expression,'state001EDCA0(object)').replace(anchor,state_helper+'\n'+anchor)
          import hashlib
          summary=[]
          for name, candidate in variants.items():
              assert claims.holds(rva,token)
              path=out/(name+'.cpp')
              path.write_text(candidate,encoding='utf-8')
              print('TRIAL_BEGIN '+name+' source_sha256='+hashlib.sha256(candidate.encode()).hexdigest(),flush=True)
              p=subprocess.run([sys.executable,'tools/probe.py',str(path),'?update@AutoAbilityBehavior@@UAE?AW4UpdateSleepTime@@XZ','0x001EDCA0','--shape'],capture_output=True,text=True)
              log=p.stdout+'\n'+p.stderr
              (out/(name+'.log')).write_text(log,encoding='utf-8')
              print(log,flush=True)
              summary.append({'name':name,'exit':p.returncode,'source_sha256':hashlib.sha256(candidate.encode()).hexdigest()})
              assert p.returncode==0
              if 'result   EXACT' in log:
                  print('EXACT_CANDIDATE '+name,flush=True)
                  print(candidate,flush=True)
                  break
          (out/'trials.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-001edca0-object-context
          path: |
            source/build/contributor_hard_finish_20261025/
            source/build/experiments/
          retention-days: 90
