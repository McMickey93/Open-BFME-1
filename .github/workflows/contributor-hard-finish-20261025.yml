          home=Path("targets/game/reverse/attempt_support/20261026-00267b10-canonical-override-visibility");assert not home.exists();home.mkdir(parents=True)
          (home/'README.md').write_text("# 00267B10: canonical getFinalOverride visibility, 2026-10-26\n\nThis is a new bounded test after the complete same-file investigation preserved\nin native bank75533e55032aac55e784923a62e61a2de4b4f77d. It does not recover\nthe390-byte body or alter its preferred bank.\n\nBase: Open-BFME/Open-BFME-1 cef684fa2faa184d71486a48f48118e237d7f0bd.\nAGENTS.md blob06b755567bb147dfee3a89f70f7bbcd38410b5b4 is unchanged.\nOfficial eligibility.open_dumps still lists all four open bodies in\ngame/gen_asm/d_00266ef0.asm. Only00267B10 was reopened and freshly claimed;\nthe other three bodies retain their already banked concrete blockers.\n\n## Independent reason to reopen\n\nThe existing bank calls ILT000022BB through an opaque member-pointer bridge.\nA compiler cannot infer that callee's memory effects from an unrelated header.\nThe actual thunk routes to Overridable::getFinalOverride() const at00087A80.\n\nExisting matched BfmeThingTBARva007243A0.cpp\n(blob16e5216983c65cc385995377a0251f49265a0d6c) records a real case where this\nexact visible recursive implementation changes caller register allocation.\nThat made the visibility hypothesis independent of the exhausted virtual-slot,\nreceiver-field, bitset, factory-branch and compiler-flag controls.\n\n## Retail and canonical provider\n\nThe complete26-byte body reads m_nextOverride at+4, walks until null, returns\nthe last node in EAX and returns without explicit arguments. It writes no\nmemory and performs no allocation, reference-count or ownership operation.\nRaw bytes:\n8bc18b500485d274108da424000000008bc28b500485d275f7c3\n\nThe full unchanged GeneralsMD Common/Overridable.h\n(blobdeaba59605a579d6bb2eb38011ed5fd355aeeaea) supplies the implementation.\nCommon/GameMemory.h is included first, with the include roots already used\nby matched Rva0037D730CompareBOB.cpp. PreRTS is deliberately unnecessary:\nit would include the target header early through other game declarations.\n\nThe canonical symbol is:\n?getFinalOverride@Overridable@@QBEPBV1@XZ\nThe original INIWater.cpp provider remains its ledger owner.\n\nThe only call adaptation is:\nthing=const_cast<Overridable*>(\n    static_cast<const Overridable*>(next)->getFinalOverride());\nBoth existing null checks and the next(+4) receiver are retained. It never calls\nthe walk on the initial template instead of next. There is no new callable\nalias, pin, substitute class, copied private Overridable declaration or\ninvented original identity.\n\n## Paired native controls and observed result\n\nOriginal MSVC7.1, /O2 /GR- plus DNDEBUG/DWIN32/D_WINDOWS/MD/EHsc and the\nrecorded GeneralsMD/shim roots. Each source compiles to its own explicit\nprivate object under build/. Caller and helper are inspected from the SAME\nobject using project build/probe helpers. Diagnostic objects are not reused\nas admitted build-cache receipts.\n\n| Source | Caller | Helper |\n| --- | --- | --- |\n| Actual headers, existing ILT bridge |374/390B,281diff,first+4|not referenced|\n| Actual headers, direct canonical call |374/390B,281diff,first+4|26/26B,exact|\n| Header-only auto_inline(off/on), ILT |374/390B,281diff,first+4|not referenced|\n| Header-only auto_inline(off/on), direct |374/390B,281diff,first+4|26/26B,exact|\n\nAll four caller raw byte arrays are identical. They have19 relocations and\n18 relocation-layout drifts. The direct variants replace one relocation's\nname with the proven canonical helper at caller+0xD6. Both helper copies\nmatch all26 raw retail bytes, with zero relocations. Default recursion already\nkeeps the real helper out of line; the scoped pragma control changes nothing.\nNo global Ob0/inline_depth override, fake noinline body, barrier, padding,\nfixed-register operation or assembly is used.\n\nThus this specific memory-effect/visibility hypothesis is refuted in the\ntested caller context. The existing owner/draw allocation and factory-branch\nsharing residue remains. This says nothing universal about all possible C++\ncontexts and does not promote the diagnostic body to production.\n\n## Reproducibility and limits\n\nNative run40296690015 / job121484355882:\nhttps://github.com/McMickey93/Open-BFME-1/actions/runs/40296690015\nArtifact12638447420 retains four sources, objects, compile logs and records.json\nfor90 days. ZIP SHA256:\nd900723d495f1c0db76a2109e99186c7ff2487d46726f634b3cf6db13907d2a7\n\nControl workflow commitc9ca393778876a264366de311bb6ee0f202cdb1c.\nThe direct default source is retained as canonical-visible.cpp.txt here.\nAn earlier harness attempt40296185642 failed before compiling because the\ncompiler helper requires absolute paths. It supplies no body verdict and was\nfixed before the four successful measurements.\n\nThe helper is already matched: its verification adds+0 C++ bytes.\nThe caller is not byte-exact. No production source, matched row, header or pin\nis changed. Preferred bank7c5d02f83c04d240cbb1ffdbd3177cf4336b7c15 is preserved.\nAny future candidate still needs complete identity, callee, DIR32 and scoped\nadmission checks; the masked caller comparisons here are diagnostic only.\n",encoding='utf-8',newline='\n')
          (home/'canonical-visible.cpp.txt').write_text("// cl: /DNDEBUG /DWIN32 /D_WINDOWS /MD /EHsc /Iinputs/reference/shims/zhcanonascii /Iinputs/reference/shims/sweep /Iinputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/GameEngine/Include /Iinputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/Libraries/Include\n#include \"Common/GameMemory.h\"\n#include \"Common/Overridable.h\"\nvoid j_000022bb();void j_0000b95b();void j_0001742c();void j_0001a9dd();void j_0002191d();void j_00026df0();void j_00028560();void j_0002bb0c();void j_0002c336();void j_000348ec();void j_000399A5();void j_0003dcf8();\nstruct Rva0020AA00Registry;extern Rva0020AA00Registry *Rva0020AA00TheRegistry;\nclass ClientRoot4120;extern ClientRoot4120 *TheGameClient;\nstruct Rva00367E30Logic;extern Rva00367E30Logic *TheBfmeGameLogic;\nclass InGameUI;extern InGameUI *TheInGameUI;\nstruct Rva00267B10Receiver {};\ntemplate<class R> R invoke0(void(*p)(),void*self) {union {void(*p)();R(Rva00267B10Receiver::*m)();}u;u.p=p;return (((Rva00267B10Receiver*)self)->*u.m)();}\ntemplate<class R,class A> R invoke1(void(*p)(),void*self,A a) {union {void(*p)();R(Rva00267B10Receiver::*m)(A);}u;u.p=p;return (((Rva00267B10Receiver*)self)->*u.m)(a);}\ntemplate<class R,class A,class B> R invoke2(void(*p)(),void*self,A a,B b) {union {void(*p)();R(Rva00267B10Receiver::*m)(A,B);}u;u.p=p;return (((Rva00267B10Receiver*)self)->*u.m)(a,b);}\ntemplate<class R,class A,class B,class C> R invoke3(void(*p)(),void*self,A a,B b,C c) {union {void(*p)();R(Rva00267B10Receiver::*m)(A,B,C);}u;u.p=p;return (((Rva00267B10Receiver*)self)->*u.m)(a,b,c);}\ntypedef char CheckMemberSize[sizeof(void(Rva00267B10Receiver::*)())==4?1:-1];\nstruct Rva00267B10Draw {char m00[0xb0];unsigned mB0;char mB4[0x3ac-0xb4];unsigned char m3AC;char m3AD[11];void*m3B8;};\nstruct Rva00267B10Flags {unsigned words[10];};\nstruct __single_inheritance Rva00267B10Object;\nstruct Rva00267B10ObjTable {void*slot[10];Rva00267B10Draw*(Rva00267B10Object::*m28)();};\nstruct __single_inheritance Rva00267B10Status;\nstruct Rva00267B10StatusTable {void*slot[127];void(Rva00267B10Status::*m1FC)(int);};\nstruct Rva00267B10Status {Rva00267B10StatusTable *table;};\nstruct Rva00267B10Object {Rva00267B10ObjTable*table;void*m04;char m08[0x38-8];float m38[3];float m44;char m48[0x110-0x48];Rva00267B10Flags m110;char m138[0x204-0x138];Rva00267B10Status *m204;};\nstruct __single_inheritance Rva00267B10Client;\nstruct Rva00267B10ClientTable {void*slot[24];void(Rva00267B10Client::*m60)(Rva00267B10Draw*);};\nstruct Rva00267B10Client {Rva00267B10ClientTable *table;};\nstruct __single_inheritance Rva00267B10UI;\nstruct Rva00267B10UITable {void*slot[56];void(Rva00267B10UI::*mE0)(Rva00267B10Draw*);};\nstruct Rva00267B10UI {Rva00267B10UITable*table;};\nstruct Rva00267B10View {void*m00;char*m04;Rva00267B10Object*m08;char m0C[0xec-12];unsigned mEC;};\nclass Rva00267B10 {public:void m00267B10(unsigned char);};\nvoid Rva00267B10::m00267B10(unsigned char value) {\n Rva00267B10View *self=(Rva00267B10View*)this;\n Rva00267B10Object *object=self->m08;\n Rva00267B10Draw *draw=(object->*object->table->m28)();\n bool selected=draw->m3AC!=0;\n if(self->m04[0x268] && (object->m110.words[8]&0x800)) {\n  if(!(object->m110.words[6]&0x800)) {object->m110.words[6]|=0x800;invoke0<void>(j_0002191d,object);}\n  Rva00267B10Status *status=object->m204;(status->*status->table->m1FC)(7);\n  invoke1<void,int>(j_000348ec,object,0x15);\n  invoke1<void,int>(j_0002bb0c,object,6);\n }\n if(invoke1<void*,char*>(j_00028560,Rva0020AA00TheRegistry,self->m04+0x25c)) {\n  Rva00267B10Flags saved=object->m110;\n  void *data=draw->m3B8;\n  Rva00267B10Client *client=(Rva00267B10Client*)TheGameClient;\n  (client->*client->table->m60)(draw);\n  void *thing;\n  if(value) {thing=object->m04;if(thing){void *next=((void**)thing)[1];if(next)thing=const_cast<Overridable*>(static_cast<const Overridable*>(next)->getFinalOverride());}}\n  else thing=invoke1<void*,char*>(j_00028560,Rva0020AA00TheRegistry,self->m04+0x25c);\n  draw=invoke3<Rva00267B10Draw*,void*,int,int>(j_0002c336,Rva0020AA00TheRegistry,thing,0,-1);\n  if(draw) {\n   invoke2<void,Rva00267B10Object*,Rva00267B10Draw*>(j_0003dcf8,TheBfmeGameLogic,object,draw);\n   invoke1<void,float*>(j_0001742c,draw,object->m38);\n   invoke1<void,float>(j_000399A5,draw,object->m44);\n   draw->mB0=self->mEC;\n   invoke1<void,Rva00267B10Flags*>(j_0000b95b,object,&saved);\n   invoke1<void,Rva00267B10Flags*>(j_0001a9dd,object,&saved);\n   invoke1<void,void*>(j_00026df0,draw,data);\n   if(selected){Rva00267B10UI *ui=(Rva00267B10UI*)TheInGameUI;(ui->*ui->table->mE0)(draw);}\n  }\n }\n}\n",encoding='utf-8',newline='\n')
          log=Path('targets/game/reverse/re_attempts.log');old=log.read_bytes()
          evidence='New independent existing007243A0 visibility witness applied via FULL canonical GameMemory+Overridable headers and actualgetFinalOverrideconst directcall onnext, no privateclasscopy/alias. Fourpaired header/ILT/direct/auto_inline controls SAME374/390B281diff first+4,19relocs18drifts. Both directcases emitrealhelperEXACT26/26B0relocs; callerbytes identical. Thuscanonicalreadonlyvisibility fails tofixowner/drawallocation. Originalbank unchanged. handoff=targets/game/reverse/attempt_support/20261026-00267b10-canonical-override-visibility/README.md blocker=regalloc/owner-draw-live-range t=15min model=gpt-6'
          subprocess.run([sys.executable,'tools/re_log.py','record','?m00267B10@Rva00267B10@@QAEXE@Z','0x00267B10','390','blocked',evidence],check=True)
          assert bank.read_bytes()==original
          new=log.read_bytes();assert new.startswith(old)
          out=Path('build/contributor_hard_finish_overridable_bank_20261026');out.mkdir(parents=True,exist_ok=True)
          subprocess.run([sys.executable,'tools/check_csv.py'],check=True)
          subprocess.run(['git','config','user.name','McMickey93'],check=True)
          subprocess.run(['git','config','user.email','347452154+McMickey93@users.noreply.github.com'],check=True)
          subprocess.run(['git','config','core.hooksPath','.githooks'],check=True)
          paths=["targets/game/reverse/attempt_support/20261026-00267b10-canonical-override-visibility/README.md","targets/game/reverse/attempt_support/20261026-00267b10-canonical-override-visibility/canonical-visible.cpp.txt",'targets/game/reverse/re_attempts.log']
          subprocess.run(['git','add','--',*paths],check=True)
          message='Record canonical override visibility and unchanged whole-file caller bytes\n\nThe full native getFinalOverride helper is26B exact, but all four paired caller controls remain374/390B281diff. Preserve the previous bank and matched provider; no new C++ exact bytes.\n\n'+claims.trailer(0x00267B10,lease)
          (out/'commit-message.txt').write_text(message,encoding='utf-8',newline='\n')
          git_bash=Path(os.environ['BFME_NATIVE_BASH']);assert git_bash.is_file();os.environ['PATH']=str(git_bash.parent)+os.pathsep+os.environ['PATH']
          r=subprocess.run(['git','commit','-F',str(out/'commit-message.txt')],capture_output=True,text=True);(out/'normal-commit.log').write_text(r.stdout+'\n'+r.stderr,encoding='utf-8');print(r.stdout+'\n'+r.stderr,flush=True);assert r.returncode==0
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r=subprocess.run([str(git_bash),'.githooks/pre-push','origin','https://github.com/Open-BFME/Open-BFME-1.git'],input='refs/heads/master '+head+' refs/heads/master '+base+'\n',capture_output=True,text=True);(out/'normal-pre-push.log').write_text(r.stdout+'\n'+r.stderr,encoding='utf-8');print(r.stdout+'\n'+r.stderr,flush=True);assert r.returncode==0
          subprocess.run([sys.executable,'tools/progress.py','origin/master'],check=True)
          assert bank.read_bytes()==original and claims.holds(0x00267B10,token)
