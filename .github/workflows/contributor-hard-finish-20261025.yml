name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Measure genuine canonical override visibility and its unchanged 26-byte provider
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,sys,subprocess,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims,eligibility,build,probe
          token="4946a86d16f24993519dc231222819430271261e"
          assert claims.fetch() and claims.holds(0x00267B10,token)
          e=claims.live(claims._read_local())[0x00267B10]
          assert e[1]['lease']=='0955b8c334ae4743bb583b16838cb1db'
          assert any(int(r['target_rva'],16)==0x00267B10 for r in eligibility.open_dumps())
          subprocess.run([sys.executable,'tools/callees.py','0x00267B10','390'],check=True)
          assert subprocess.check_output(['git','hash-object','targets/game/reverse/attempts/0x00267b10.cpp'],text=True).strip()=='7c5d02f83c04d240cbb1ffdbd3177cf4336b7c15'
          assert subprocess.check_output(['git','hash-object','inputs/reference/CnC_Generals_Zero_Hour/GeneralsMD/Code/GameEngine/Include/Common/Overridable.h'],text=True).strip()=='deaba59605a579d6bb2eb38011ed5fd355aeeaea'
          out=Path('build/contributor_hard_finish_overridable_20261026').resolve();out.mkdir(parents=True,exist_ok=True)
