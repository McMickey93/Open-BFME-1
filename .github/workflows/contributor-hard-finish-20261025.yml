name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Bank measured provider evidence through normal gates and serve remaining siblings
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims,eligibility
          token='aa5f5dd9fe527612c8822631aa18d149b5e47239'
          assert claims.fetch()
          active=claims.live(claims._read_local())
          for rva in [0x00269C50,0x00271B40]:
              e=active.get(rva)
              assert e and e[0]==token and e[1]['owner']==os.environ['BFME_CLAIM_OWNER'] and e[1]['lease']=='5d82ccfbf2544ed0b704840d11b13543'
              assert claims.holds(rva,token)
          base=subprocess.check_output(['git','rev-parse','origin/master'],text=True).strip()
          out=Path('build/contributor_hard_finish_sp_bank_20261025');out.mkdir(parents=True,exist_ok=True)
          doc="# SpecialPower native provider context, 2026-10-25\n\n## Verified scope and unchanged target bytes\n\nBase: Open-BFME/Open-BFME-1 f633d0e97a953289405438821be0c09b28527bbb.\nThe served finish candidate is 00269C50 in game/gen_asm/d_00266ef0.asm.\nThe current AGENTS.md blob is 06b755567bb147dfee3a89f70f7bbcd38410b5b4.\nThe original native MSVC 7.1 compiler and normal project probe paths were used.\n\n00269C50 has 1073 executable bytes, ending in RET4 at +42E and INT3 at +431.\nThe correct source is attempt_support/0x00269c50-20261013-formB-constref-abi.inc:\n1073B, 46 relocations, 23 non-relocation differences, shape .997.\nThe score-preferred attempt's by-value configure key is ABI-wrong. The matched\n0039B6D0 body dereferences argument two, so const Int& remains mandatory.\nNo signature guessing, dummy expressions, register padding or assembly was used.\n\nThe remaining sites are the frame-global ECX/EDX choice at +C7, configure\nargument allocation/scheduling at +181/+193, and Coord3D copy register choices\nat +1EA. The old 250+ spelling and flag/rotation sweeps were read and not repeated.\n\n## New genuine provider visibility measurements\n\nThe complete existing provider implementations were made visible as in-class\nnon-expanding members, with their real layouts and algorithms. Each provider\nwas separately measured before interpreting its caller:\n\n| Existing provider | Bytes / relocations | Provider result | 00269C50 caller |\n| --- | --- | --- | --- |\n| configure 0039B6D0 | 105 / 5 | exact | 1073 / 23 differences |\n| configure + clearObjectEntries 0039B660 | 105 / 5 and 79 / 5 | both exact | 1073 / 23 |\n| subtract 000C98C0 | 33 / 0 | exact | 1073 / 23 |\n| getControllingPlayer 001BE3F0 | 18 / 1 | exact | 1073 / 23 |\n| configure + subtract + controlling player | 105 / 5, 33 / 0, 18 / 1 | all exact | 1073 / 23 |\n| createViewObject 00269130, original inline defaults | 422 / 28 | exact | 1073 / 23 |\n\nconfigure retains the genuine StringBase<char>::set assignment wrapper,\nconst-reference dereference, player index +24, mode/value/name/trailing/mask\nfields +14/+18/+1C/+20/+24, and object-list traversal through Object+88.\nThe declaration-only layout control is also 1073/23.\n\ncreateViewObject retains the real AsciiString lifetime, 12B BitFlags<86>,\nfactory call, position/shroud updates and DeletionUpdate lookup.\nBoth caller EH settings and the provider's documented _STLP_NO_EXCEPTIONS\nsetting yield the same exact 422B provider and unchanged 1073/23 caller.\n\nThe full aboutToDoSpecialPower 00268CB0 provider also reproduces exactly:\n379B and 20 relocations. Its real AsciiString return/EH and AudioEventRTS\nlifetimes, script/audio vslots and sound offsets were preserved.\nIts witnessed inline_recursion(on)/inline_depth(3) context changes the\ndeclaration-only caller control to 1033B/52 differences; adding the genuine\n379B member remains byte-identical to that control. Restoring documented\ninline defaults before the finish definition does not restore the 1073B\ncontext. This is a context limitation, not evidence of a better target body.\nApplying that sound-provider context to createViewObject gives only 401B;\nremoving it restores the independently exact 422B provider above.\n\nThe about identity witness proves class-tagged PBVCoord3D; the current Coord3D\nheader and create source use struct. All probes are private diagnostics;\nno callable symbol, shared header or production class was silently changed.\n\n## Same-file sync sibling\n\n00271B40 ends at RET 00271C38 (+F8): 249 code bytes plus 33 INT3 padding bytes\ninside its 282-byte ledger row. The baseline remains 249B / 9 relocations /\n12 differences, at +BA..BD, +C3..C6 and +EC..EF.\nThe new genuine complete terminal 004141A0 guarded virtual forwarder is\nindependently exact at 20B / 0 relocations. Making it visible leaves the same\n249B/12-difference caller. Existing fade/shadow/flag/ABI/assembly controls from\nidentity_evidence/00271b40-call-setup-retry.md were read and not repeated.\nNo unproved inherited BfmeThingEGF identity is promoted.\n\n## Reproducible evidence\n\nEach linked artifact retains private source, probe logs, objects and receipts\nfor 90 days.\n\n- Baselines: run 40242817538, artifact 12617681490.\n- Complete valid configure/clear/subtract/player and terminal-forwarder tests:\n  [run 40243852768](https://github.com/McMickey93/Open-BFME-1/actions/runs/40243852768),\n  [artifact 12617254605](https://github.com/McMickey93/Open-BFME-1/actions/runs/40243852768/artifacts/12617254605),\n  zip SHA256 aebc06987ceee349033cff35b0e6a4fe903756f95f4acaaf99869ded4711b4b2.\n- Scoped sound context and complete open-file inventory:\n  [run 40244253982](https://github.com/McMickey93/Open-BFME-1/actions/runs/40244253982),\n  [artifact 12617807430](https://github.com/McMickey93/Open-BFME-1/actions/runs/40244253982/artifacts/12617807430),\n  zip SHA256 5a6aa609c97fa3cd48e736f6ae05106186ce9885cb2104c54eaaad1df5702b4d.\n- Correctly isolated view provider:\n  [run 40244372422](https://github.com/McMickey93/Open-BFME-1/actions/runs/40244372422),\n  [artifact 12617534670](https://github.com/McMickey93/Open-BFME-1/actions/runs/40244372422/artifacts/12617534670),\n  zip SHA256 dc22b83e87f2de2394abe3ea06a8ffe053af235ead4dfc42a18af323a97b3801.\n\nThe first visibility diagnostic accidentally omitted the original\n_STLP_USE_STATIC_LIB and BFME_STLP_NODE_ALLOC defines when trimming the long\ncomment preamble. Its declaration-only control exposed the error (1056B/58);\nit was corrected before drawing the 1073B conclusions above.\nAn intermediate sound context missed j_00001e88's declaration and failed to\ncompile; the linked complete run includes it. Those failed probes are not\nsuccessful verifications.\n\n## Work continues in the whole file\n\nThe finish queue advertised two bodies, but eligibility.open_dumps finds four\nopen rows in this generated file: 00267B10 (390B), 00269C50 (1073B), 0026EED0\n(289B), and 00271B40 (282B including padding). The other two siblings remain\npending and will be investigated before leaving this file.\n\nNo production code, matched row or pin changes are made here.\nAll recompiled exact providers were already matched before this session.\nNew C++ exact progress is +0 bytes. The original-code register/call-order\nresidue remains a concrete blocker for the two measured callers.\n"
          docpath=Path('targets/game/reverse/attempt_support/20261025-specialpower-native-provider-context.md')
          assert not docpath.exists()
          docpath.write_text(doc,encoding='utf-8',newline='\n')
          logpath=Path('targets/game/reverse/re_attempts.log');old=logpath.read_bytes()
          ev='Original MSVC7.1 correct constInt& ABI baseline1073B46relocs23diffshape.997. Complete native noinline configure105B,clear79B,subtract33B,getControllingPlayer18B and createViewObject422B providers each reproduce exactly but caller remains1073/23; combined controls inert. Exact about379B requires an inline context whose declaration-only caller is1033B52diff, unchanged by visibility. No dummy temp, signature compromise, or production change. handoff=targets/game/reverse/attempt_support/20261025-specialpower-native-provider-context.md blocker=regalloc/correct-ABI-register-and-push-scheduling t=35min model=gpt-6'
          subprocess.run([sys.executable,'tools/re_log.py','record','?finishSpecialPower@SpecialPowerModule@@QAEXI@Z','0x00269C50','1073','blocked',ev],check=True)
          ev='Retail truebody249B RET+F8 firstINT3+F9; ledger282 includes33padding. Complete genuine terminal004141A0 guardedforwarder20B0reloc independently exact; visible nonexpanding provider leaves249B9relocs12diff at+BA,+C3,+EC callsetup swaps. Existing fade/shadow/ABI/flags/asm experiments read, not repeated. No original methodidentity guessed and no production change. handoff=targets/game/reverse/attempt_support/20261025-specialpower-native-provider-context.md blocker=codegen-order/thiscall-immediate-push t=8min model=gpt-6'
          subprocess.run([sys.executable,'tools/re_log.py','record','?bfmeSyncEGF@BfmeThingEGF@@QAEXXZ','0x00271B40','249','blocked',ev],check=True)
          new=logpath.read_bytes();assert new.startswith(old);append=new[len(old):].decode('utf-8')
          subprocess.run([sys.executable,'tools/check_csv.py'],check=True)
          subprocess.run(['git','config','user.name','McMickey93'],check=True)
          subprocess.run(['git','config','user.email','347452154+McMickey93@users.noreply.github.com'],check=True)
          subprocess.run(['git','config','core.hooksPath','.githooks'],check=True)
          paths=[str(docpath).replace('\\','/'),str(logpath).replace('\\','/')]
          subprocess.run(['git','add','--',*paths],check=True)
          message='Record full SpecialPower provider-context checks and continue whole-file work\n\nPreserve genuine provider verifications and unchanged correct-ABI/call-order residues. No new C++ exact bytes, matched rows, or production source changes.\n\n'+claims.trailer(0x00269C50,'5d82ccfbf2544ed0b704840d11b13543')+'\n'+claims.trailer(0x00271B40,'5d82ccfbf2544ed0b704840d11b13543')
          (out/'commit-message.txt').write_text(message,encoding='utf-8',newline='\n')
          p=subprocess.run(['git','commit','-F',str(out/'commit-message.txt')],capture_output=True,text=True);(out/'normal-commit.log').write_text(p.stdout+'\n'+p.stderr,encoding='utf-8')
          print(p.stdout,flush=True);print(p.stderr,flush=True);assert p.returncode==0
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          git_bash=Path(os.environ['BFME_NATIVE_BASH']);assert git_bash.is_file()
          os.environ['PATH']=str(git_bash.parent)+os.pathsep+os.environ['PATH']
          p=subprocess.run([str(git_bash),'.githooks/pre-push','origin','https://github.com/Open-BFME/Open-BFME-1.git'],input='refs/heads/master '+head+' refs/heads/master '+base+'\n',capture_output=True,text=True)
          (out/'normal-pre-push.log').write_text(p.stdout+'\n'+p.stderr,encoding='utf-8')
          print(p.stdout,flush=True);print(p.stderr,flush=True);assert p.returncode==0
          assert claims.holds(0x00269C50,token) and claims.holds(0x00271B40,token)
          subprocess.run(['git','bundle','create',str(out/'bank-handoff.bundle'),base+'..HEAD'],check=True)
          receipt={'base':base,'native_commit':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'paths':paths,'files':[{'path':str(docpath).replace('\\','/'),'content':doc}],'append':append,'message':message,'claim_token':token,'claim_lease':'5d82ccfbf2544ed0b704840d11b13543'}
          print('SPECIALPOWER_PROVIDER_HANDOFF '+json.dumps(receipt),flush=True)
          (out/'bank-handoff-receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          assert claims.fetch()
          active=claims.live(claims._read_local())
          rows=[row for row in eligibility.open_dumps() if row['source']=='game/gen_asm/d_00266ef0.asm']
          extras=[row for row in rows if int(row['target_rva'],16) not in [0x00269C50,0x00271B40]]
          assert {int(row['target_rva'],16) for row in extras}=={0x00267B10,0x0026EED0}
          assert all(int(row['target_rva'],16) not in active for row in extras)
          for row in extras:
              rva=int(row['target_rva'],16);size=int(row['target_size'])
              subprocess.run([sys.executable,'tools/brief.py','--rvas',row['target_rva']],check=True)
              subprocess.run([sys.executable,'tools/callees.py',row['target_rva'],str(size)],check=True)
              for line in logpath.read_text(encoding='utf-8',errors='replace').splitlines():
                  if row['target_rva'].lower() in line.lower():print('SIBLING_HISTORY '+line,flush=True)
          marker=claims._record(os.environ['BFME_CLAIM_OWNER'],4,note='Pending explicit connector claims for whole-file queued siblings of served00269C50:00267B10 and0026EED0')
          record=json.loads(subprocess.check_output(['git','show','-s','--format=%B',marker],text=True))
          print('SIBLING_CLAIM_TRANSPORT '+json.dumps({'rvas':[row['target_rva'] for row in extras],'record':record,'base':base,'tree':'4b825dc642cb6eb9a060e54bf8d69288fbee4904'}),flush=True)
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-specialpower-bank-and-wholefile-siblings
          path: |
            source/build/contributor_hard_finish_sp_bank_20261025/
            source/build/experiments/
          retention-days: 90
