name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Gate handoff with Git Bash and serve next large finish file
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          rva=0x001EDCA0; token='910b0d6b2329fa9bd666f48eb0947a66564c15ba'
          assert claims.fetch()
          entry=claims.live(claims._read_local()).get(rva)
          assert entry and entry[0]==token and entry[1]['owner']==os.environ['BFME_CLAIM_OWNER']
          assert entry[1]['lease']=='86bb693184074854a5d4d12c2a127df4'
          assert claims.holds(rva,token)
          bank='targets/game/reverse/attempts/0x001edca0.cpp'
          assert subprocess.check_output(['git','hash-object',bank],text=True).strip()=='576b068db3801a64f55d1629ec99d99f9859a763'
          out=Path('build/contributor_hard_finish_20261025');out.mkdir(parents=True,exist_ok=True)
          base=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          path=Path('targets/game/reverse/attempt_support/001edca0-native-object-context-20261025.md')
          assert not path.exists()
          doc="# AutoAbility update: native object-context controls (2026-10-25)\n\n## Scope and inputs\n\nThe unbounded project finish picker served 0x001EDCA0, the complete 1944-byte\nAutoAbilityBehavior update body, in run 40236435719. Its whole current source\nunit contains the naked dump only. The existing preferred bank was retained.\n\n- BFME 1 source: f633d0e97a953289405438821be0c09b28527bbb.\n- Preferred bank blob: 576b068db3801a64f55d1629ec99d99f9859a763.\n- AGENTS.md blob: 06b755567bb147dfee3a89f70f7bbcd38410b5b4.\n- Original MSVC 7.1, native Windows Actions, build defaults /O2 /GR- /EHsc-,\n  then the bank's /DNDEBUG /DWIN32 /MD /EHsc /D_STLP_USE_STATIC_LIB and\n  WWLib/GameLogic include flags, with STLport and the bank's two defines.\n- Every diagnostic source/object lived under private build paths. Claims were\n  fetched through the normal reader, owner/lease checked, and the exact claim\n  generation fenced with claims.holds before experiments.\n\nThe complete RET at 0x001EE437 and following INT3 establish the old extent.\nThe constructor-installed update-interface vtable and ILT evidence are in the\nbank. The independent 16 October ILT-oracle report already retired the wrong\nModuleData destructor identity; the current ledger uses the opaque dup alias.\nThis investigation changes no identity, provider, pin, or production source.\n\n## Reference lead and measured controls\n\nBFME 2 revision 442550ad8af2bd63e636ccf140ab4863af48baf3,\nCode/GameEngine/Source/GameLogic/Object/Body/ActiveBody.cpp (blob\nb1e720073a89520677062b47bc2d7f4474addc37), documents static inline mask helpers\ntaking Object explicitly to retain the damage-info register. This suggested\nchanging the early intersection-call context while leaving all kind-bit order,\nloops, callee ABI, and lifetimes unchanged. It is a lead, not BFME 1 proof.\n\nRun [40237262539](https://github.com/McMickey93/Open-BFME-1/actions/runs/40237262539)\nreproduced the bank, then measured six controls: Object/mask helper, reversed\nhelper parameters, receiver/words helper without Object, Object helper for the\nstate bit, and that state helper combined with each Object/mask order.\nAll produced 1944 bytes, 74 relocations, 66 non-relocation byte differences from\n+0x27B, two misaligned relocation sites, and instruction-shape similarity 0.995.\nNo variant improved the preferred bank.\n\nThe separate callee-visibility hypothesis used the already matched real\nRva001ED9A0Mask::intersects provider, whose source blob is\na84c2e5694c2fc123e7b18ea95fd3b4aa502a66b. Run\n[40237520843](https://github.com/McMickey93/Open-BFME-1/actions/runs/40237520843)\ntested its real ten-word intersection as an out-of-class noinline definition,\nan in-class noinline definition, and with the early Object/mask helper.\nEach provider reproduced all 189 retail bytes with zero relocations. Each\ncaller retained exactly the same 1944/66/+0x27B result and two layout warnings.\nThe 189 provider bytes were already matched and add no new progress.\n\nThe two successful runs retain private sources, probe logs, objects and\ndependency receipts for 90 days:\n[object contexts](https://github.com/McMickey93/Open-BFME-1/actions/runs/40237262539/artifacts/12615567272),\nzip SHA256 69009119f9ada075fcf7480057a70757e13e65f869a51ccb320144ae1bf61248;\n[provider visibility](https://github.com/McMickey93/Open-BFME-1/actions/runs/40237520843/artifacts/12615782004),\nzip SHA256 61feab87124d818d6c799d770750470298820b058edec23d96d33d076575611f.\nThe fork workflow at a6142c19e1c5921f83678aeea0366838fad9be78 and\na64699ce7777679bf9ad16fe5fc1a4bf4429c0c9 records exact transformations.\n\n## Remaining blocker\n\nRetail materializes EBX=0x100 and EDI=0x400 at +0x27B/+0x280. The bank\nmaterializes EDI=0x100 and EBX=0x800, then folds bit 10 to TEST CH,4 instead of\nretail's dword memory/register TEST. The second structural difference is near\n+0x320. This is still a failed complete-body match, not a relocation or byte\nacceptance. The two relocation-layout warnings also prevent treating its masked\nscore as strict verification.\n\nEarlier evidence already rules out 24 bit-test permutations, return-width and\nnative bitset alternatives, word-mask wrappers, loop/nesting/lifetime families,\nand visible recursive override lookup. The new controls rule out transferring\nthis particular early Object-mask recipe and exposing this particular genuine\ncallee. They do not prove all C++ spellings unreachable.\n\nKeep the preferred bank. A retry needs a distinct evidence-backed cause for\nmask invariant selection / instruction choice, then complete raw and resolved\nbody verification. Progress against origin/master remained +0 C++ exact bytes.\n"
          path.write_text(doc,encoding='utf-8',newline='\n')
          logpath=Path('targets/game/reverse/re_attempts.log')
          old=logpath.read_bytes()
          evidence="Native MSVC7.1 reproduces preferred bank1944B/74relocs/66nonrelocdiffs from+27B with2misalignedrelocsites, shape0.995. Six early Object/mask context controls from BFME2 ActiveBody recipe and three independently exact189B mask-provider visibility controls leave same caller result. Provider189B already matched, no new C++ bytes. Preferred bank retained; current ledger dup identity already correct. handoff=targets/game/reverse/attempt_support/001edca0-native-object-context-20261025.md blocker=regalloc/loop-mask-constant-selection t=18min model=gpt-6"
          subprocess.run([sys.executable,'tools/re_log.py','record','?update@AutoAbilityBehavior@@UAE?AW4UpdateSleepTime@@XZ','0x001EDCA0','1944','blocked',evidence],check=True)
          new=logpath.read_bytes()
          assert new.startswith(old)
          append=new[len(old):].decode('utf-8')
          subprocess.run([sys.executable,'tools/check_csv.py'],check=True)
          subprocess.run(['git','config','user.name','McMickey93'],check=True)
          subprocess.run(['git','config','user.email','347452154+McMickey93@users.noreply.github.com'],check=True)
          subprocess.run(['git','config','core.hooksPath','.githooks'],check=True)
          subprocess.run(['git','add','--',str(path),str(logpath)],check=True)
          message='Document native AutoAbility hard-finish controls\n\nPreserve nine new context and callee-visibility controls without changing the preferred bank or counting the existing 189-byte helper again.\n\n'+claims.trailer(rva,entry[1]['lease'])
          (out/'commit-message.txt').write_text(message,encoding='utf-8')
          p=subprocess.run(['git','commit','-F',str(out/'commit-message.txt')],capture_output=True,text=True)
          (out/'normal-commit.log').write_text(p.stdout+'\n'+p.stderr,encoding='utf-8')
          print(p.stdout,flush=True);print(p.stderr,flush=True);assert p.returncode==0
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          git_bash=Path(os.environ['ProgramFiles'])/'Git/bin/bash.exe'
          assert git_bash.is_file()
          p=subprocess.run([str(git_bash),'.githooks/pre-push','origin','https://github.com/Open-BFME/Open-BFME-1.git'],input='refs/heads/master '+head+' refs/heads/master '+base+'\n',capture_output=True,text=True)
          (out/'normal-pre-push.log').write_text(p.stdout+'\n'+p.stderr,encoding='utf-8')
          print(p.stdout,flush=True);print(p.stderr,flush=True);assert p.returncode==0
          assert claims.holds(rva,token)
          subprocess.run(['git','bundle','create',str(out/'handoff.bundle'),base+'..HEAD'],check=True)
          files=[str(path).replace('\\','/'),str(logpath).replace('\\','/')]
          receipt={'base':base,'native_commit':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'paths':files,'message':message,'append':append,'document':doc,'claim_token':token,'claim_lease':entry[1]['lease']}
          print('HARD_FINISH_HANDOFF '+json.dumps(receipt),flush=True)
          (out/'handoff-receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims,eligibility,next_work,build
          assert claims.fetch(), 'Cannot read shared claims'
          busy=eligibility.busy_rvas()
          rows=build.load_all_function_rows()
          busy_sources={row.get('source') for row in rows if row.get('target_rva','').lower() in busy}
          candidates=next_work.finish_candidates(min_score=0.9,max_attempts=0,cooldown_days=0)
          pool=[c for c in candidates if int(c['target_size'])>512 and c['target_rva'].lower() not in busy and c['source'] not in busy_sources]
          candidate=next_work.finish_choice(pool) if pool else None
          print('LARGE_HARD_FINISH_SELECTION '+json.dumps({'selection':candidate,'pool':len(pool),'all_finish':len(candidates),'busy':len(busy),'cluster':next_work.cluster_of(candidate,candidates) if candidate else []}),flush=True)
          if candidate:
              rva=candidate['target_rva']
              subprocess.run([sys.executable,'tools/brief.py','--rvas',rva],check=True)
              assert claims.fetch()
              assert int(rva,16) not in claims.live(claims._read_local())
              marker=claims._record(os.environ['BFME_CLAIM_OWNER'],4,note='Pending explicit connector claim for served large hard-finish whole file')
              record=json.loads(subprocess.check_output(['git','show','-s','--format=%B',marker],text=True))
              base=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              print('NEXT_CLAIM_TRANSPORT '+json.dumps({'rva':rva,'record':record,'base':base,'tree':'4b825dc642cb6eb9a060e54bf8d69288fbee4904'}),flush=True)
          
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-001edca0-gated-handoff
          path: |
            source/build/contributor_hard_finish_20261025/
            source/build/experiments/
          retention-days: 90
