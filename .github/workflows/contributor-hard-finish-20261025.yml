          receipt={'base':base,'native_commit':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'paths':paths,'append':new[len(old):].decode('utf-8'),'message':message,'claim_token':token,'claim_lease':lease,'files':[{'path':p,'sha':subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip(),'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]}
          (out/'bank-handoff-receipt.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8');print('OVERRIDE_VISIBILITY_BANK '+json.dumps(receipt),flush=True)
          marker=claims._record(os.environ['BFME_CLAIM_OWNER'],-1,note='released: independently measured canonical override visibility refuted, native evidence regularly banked')
          record=json.loads(subprocess.check_output(['git','show','-s','--format=%B',marker],text=True))
          print('OVERRIDE_VISIBILITY_RELEASE '+json.dumps({'rvas':['0x00267B10'],'expected':token,'record':record,'base':base,'tree':'4b825dc642cb6eb9a060e54bf8d69288fbee4904'}),flush=True)
          
