name: Contributor BFME1 hard finish selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-hard-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:hard-finish-20261025
      BFME_MODEL: gpt-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          fetch-depth: 128
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate ledger and current project instructions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 -m pip install -r tools/requirements.txt
          git fetch --depth 128 --no-tags origin refs/heads/master:refs/remotes/origin/master
          git switch --detach origin/master
          python3 tools/check_csv.py
          test "$(git hash-object AGENTS.md)" = 06b755567bb147dfee3a89f70f7bbcd38410b5b4
      - name: Locate remaining normal residue before any coupled source trials
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          git_bash="$BASH"
          [[ "$git_bash" == *.exe ]] || git_bash="$git_bash.exe"
          export BFME_NATIVE_BASH="$(cygpath -aw "$git_bash")"
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import claims
          token='06d3feefd48097e4ef5129b93418d632502181df'
          assert claims.fetch()
          entry=claims.live(claims._read_local()).get(0x00925D10)
          assert entry and entry[0]==token and entry[1]['lease']=='a5a918136da04d4e80801a1a798fe459'
          assert claims.holds(0x00925D10,token)
          out=Path('build/contributor_hard_finish_skin_20261025');out.mkdir(parents=True,exist_ok=True)
          source=Path('targets/game/reverse/attempts/0x00925d10.cpp').read_text(encoding='utf-8')
          assert hashlib.sha256(source.encode()).hexdigest()=='f4cc45ef922f15943542b374420e314d1a4425920ca7ac8f83c108c5a5fa04fa'
          # The 25 October handoff's parens mode touches six po-> blend assignments.
          # These controls touch only the three previously untested out-> normal RHS.
          lines=source.splitlines()
          indexes=[i for i,line in enumerate(lines) if re.match(r'\s*out->[XYZ] = ',line)]
          assert len(indexes)==3
          variants={}
          for mask in range(1,8):
              changed=lines[:]
              for bit,i in enumerate(indexes):
                  if mask & (1<<bit):
                      left,right=changed[i].split(' = ',1)
                      changed[i]=left+' = ('+right[:-1]+');'
              variants['normal-rhs-parens-%d'%mask]='\n'.join(changed)+'\n'
          start=source.index('\t\t\tin = srcN[0];',source.index('\t\t} else {'))
          end=source.index('\t\t}\n\t\tlinks += n;',start)
          anchor='void BfmeDst1016::bfmeSet1016(int a, int b, int r)'
          assert source.count(anchor)==1
          for accessor in [False,True]:
              for parens in [False,True]:
                  expressions=[]
                  for row,field in enumerate('XYZ'):
                      lhs='(*this)[%d]'%row if accessor else 'Row[%d]'%row
                      rhs='%s.X * in->X + %s.Y * in->Y + %s.Z * in->Z'%(lhs,lhs,lhs)
                      if parens: rhs='('+rhs+')'
                      expressions.append('            out->%s = %s;'%(field,rhs))
                  helper='''struct Rva00925D10NormalArray : public Matrix3D {
              __forceinline void apply(const Vector3 *in, Vector3 *out, int count) const {
                  while(count--) {
          '''+ '\n'.join(expressions)+'''
                      ++in;
                      ++out;
                  }
              }
          };
          typedef char CheckNormalArrayLayout[(sizeof(Rva00925D10NormalArray)==sizeof(Matrix3D))?1:-1];
          '''
                  replacement='\t\t\t((const Rva00925D10NormalArray *)pm)->apply(srcN[0], dstN, n);\n'
                  candidate=(source[:start]+replacement+source[end:]).replace(anchor,helper+'\n'+anchor)
                  name='normal-member-%s-%s'%('accessor' if accessor else 'row','parens' if parens else 'bare')
                  variants[name]=candidate
          import build,probe
          from experiment_store import compile_cached,record_result
          image=Path(build.EXE).read_bytes();offset=build.rva_to_file_offset(build.pe_sections(image),0x00925D10)
          retail=image[offset:offset+1634]
          assert 0x001EDCA0 not in claims.live(claims._read_local()), 'Old AutoAbility claim remains live'
          print('OLD_CLAIM_RELEASE_CONFIRMED',flush=True)
          symbol='?bfmeSet1016@BfmeDst1016@@QAEXHHH@Z'
          regions=[('before-blend',0,0x303),('weighted-vertices',0x303,0x3dc),('weighted-normals',0x3dc,0x4dc),('single-vertices',0x4dc,0x59c),('single-normals',0x59c,0x5e3),('tail',0x5e3,1634)]
          allresults=[]
          def measure(name,candidate):
              assert claims.holds(0x00925D10,token)
              path=out/(name+'.cpp');path.write_text(candidate,encoding='utf-8')
              obj,reused=compile_cached(path)
              compiled,relocs=build.read_object_symbol_bytes(obj,symbol)
              compiled=bytes(compiled)
              R,O,ri,oi,rb,ob,unmapped=probe.diagnostic_streams(retail,compiled,relocs)
              diffs=[i for i in range(min(len(rb),len(ob))) if rb[i]!=ob[i]]
              result={'name':name,'size':len(compiled),'diffs':len(diffs),'unmapped':len(unmapped),'regions':{n:sum(a<=i<b for i in diffs) for n,a,b in regions},'offsets':diffs,'source_sha256':hashlib.sha256(candidate.encode()).hexdigest()}
              record_result(path,symbol,0x00925D10,retail,compiled,relocs)
              allresults.append(result)
              (out/(name+'-regions.json')).write_text(json.dumps(result,indent=2),encoding='utf-8')
              print('REGION_RESULT '+json.dumps(result),flush=True)
              if len(compiled)==1634 and not diffs and not unmapped:
                  print('EXACT_CANDIDATE '+name,flush=True);print(candidate,flush=True)
              return result
          baseline=measure('preferred-region-control',source)
          assert baseline['size']==1634 and baseline['diffs']==20 and baseline['unmapped']==0
          for family in ['normal-member-row-bare','normal-member-row-parens']:
              result=measure(family+'-region-control',variants[family])
              if result['size']!=1634 or result['unmapped'] or result['regions']['single-normals']>=20:
                  print('NO_REGION_IMPROVEMENT_SKIP_WALKER_SEARCH '+family,flush=True);continue
              first='\t\t\tpo = dstV;\n\t\t\tpb = srcV[1];\n\t\t\tpa = srcV[0];'
              second='\t\t\tpa = srcN[0];\n\t\t\tpb = srcN[1];\n\t\t\tpo = dstN;'
              assert variants[family].count(first)==1 and variants[family].count(second)==1
              import itertools
              exact=False
              for i,perm1 in enumerate(itertools.permutations(first.splitlines())):
                  for j,perm2 in enumerate(itertools.permutations(second.splitlines())):
                      candidate=variants[family].replace(first,'\n'.join(perm1)).replace(second,'\n'.join(perm2))
                      r=measure(family+'-walkers-%d-%d'%(i,j),candidate)
                      if r['size']==1634 and r['diffs']==0 and r['unmapped']==0:exact=True;break
                  if exact:break
              if exact:break
          (out/'normal-regions-and-walkers.json').write_text(json.dumps(allresults,indent=2),encoding='utf-8')
          
          PY
      - name: Measure unchanged baseline
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-hard-finish
          python3 tools/progress.py origin/master
      - name: Save private compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme1-hard-finish-skin-regions
          path: |
            source/build/contributor_hard_finish_skin_20261025/
            source/build/experiments/
          retention-days: 90
