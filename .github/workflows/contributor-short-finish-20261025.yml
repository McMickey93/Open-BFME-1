name: Contributor BFME1 short hard finish
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-short-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-short-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:short-finish-20261025
    steps:
      - name: Read the current official tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the official ledger and read upstream master
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 short-finish
          git fetch --no-tags --depth=128 origin refs/heads/master:refs/remotes/origin/master
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
      - name: Prove the native counted-reference constructor and consumer
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 short-finish
          python3 -u - <<'PY'
          import csv,hashlib,json,os,re,subprocess,sys,time,traceback
          from pathlib import Path
          root=Path.cwd().resolve()
          out=root/"build/short-counted-audio-20261025"
          out.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(root/"tools"))
          import claims
          rvas=(0x0060F3C0,0x000B4780)
          token="968cde904cdb7dc7ea22bb31f11f71d9d5b6f67b"
          owner="github:McMickey93:bfme1:short-finish-20261025"
          lease="97c6aa81c262443f9f5cb39b7d65f7e0"
          provider="game/GameEngine/Source/Common/Audio/AudioEventRTSThinExtraCtor.cpp"
          result={"status":"starting","workflow_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"commands":[],"claims":[]}
          def save(): (out/"result.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          def run(label,args,required=True,show=True):
              cp=subprocess.run(args,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(label+".log")).write_bytes(cp.stdout)
              result["commands"].append({"label":label,"argv":list(map(str,args)),"exit_code":cp.returncode,"sha256":hashlib.sha256(cp.stdout).hexdigest()})
              save()
              print("TYPED_COMMAND",label,"exit",cp.returncode,flush=True)
              if show: print(cp.stdout.decode("utf-8","replace"),flush=True)
              if required and cp.returncode: raise RuntimeError(label+" failed")
              return cp.stdout.decode("utf-8","replace")
          def fence(label):
              if not claims.fetch(): raise RuntimeError("Cannot read actual upstream claims")
              entries=claims._read_local()
              for rva in rvas:
                  entry=entries.get(rva)
                  if not entry: raise RuntimeError("Missing actual claim")
                  current,info=entry
                  if current!=token or info.get("owner")!=owner or info.get("lease",current)!=lease or info.get("expires",0)<=time.time() or not claims.holds(rva,token): raise RuntimeError("Claim lost before "+label)
                  result["claims"].append({"at":label,"rva":f"0x{rva:08X}","token":current,"record":info})
              save()
          def guard(path,expected):
              got=subprocess.check_output(["git","hash-object","--",path],cwd=root).decode().strip()
              if got!=expected: raise RuntimeError("Reviewed file changed: "+path)
          def parse(text):
              m=re.search(r"^size\s+ours=(\d+) retail=(\d+)\s+relocs=(\d+)",text,re.M)
              d=re.search(r"^diffs\s+(\d+) non-reloc byte\(s\); first at \+(\d+)",text,re.M)
              return {"ours":int(m[1]),"retail":int(m[2]),"relocs":int(m[3]),"diffs":int(d[1]) if d else 0,"diagnostic_exact":"result   EXACT" in text} if m else {"unavailable":True}
          try:
              result["source_sha"]=subprocess.check_output(["git","rev-parse","HEAD"],cwd=root).decode().strip()
              if result["source_sha"]!="f633d0e97a953289405438821be0c09b28527bbb": raise RuntimeError("Unexpected pin")
              guard("AGENTS.md","06b755567bb147dfee3a89f70f7bbcd38410b5b4")
              guard(provider,"8f32891345c75dea94d26f777a45c3881a7de327")
              guard("game/GameEngine/Source/Common/Audio/AudioEventRTSCommonInit.cpp","360b00c43cab14b3cdd31500685fa73fe3b78625")
              guard("targets/game/reverse/canonical_classes.csv","9276e02f13f68cf9f92bfaf47ffe4c57d54dd2ad")
              guard("targets/game/reverse/attempt_history/0x0060f3c0/2b3170dba817b184f665e9ace3a7618941e2341012ff2f04eb53ebc11c75b112.json","bf3df1621d304daf5b6c6c1f75160b914f701d1b")
              fence("before-native-context")
              selected={0x0060F3C0,0x000B4780,0x000B2610,0x000B4690,0x000B2D90,0x000B2F00,0x000B4440,0x000B45E0}
              with (root/"targets/game/reverse/functions.csv").open(encoding="utf-8-sig",newline="") as handle:
                  rows=[row for row in csv.DictReader(handle) if row.get("target_rva") and int(row["target_rva"],16) in selected]
              result["rows"]=rows
              print("TYPED_ROWS "+json.dumps(rows),flush=True)
              for rv in (0x000B4780,0x000B2610,0x000B4690):
                  row=next(r for r in rows if int(r["target_rva"],16)==rv)
                  run("callees-"+f"{rv:08x}",[sys.executable,"tools/callees.py",f"0x{rv:08X}",row["target_size"]])
                  run("retail-"+f"{rv:08x}",[sys.executable,"tools/dis_retail.py",f"0x{rv:08X}",str(int(row["target_size"])+4)],True)
              run("callers-thin-provider",[sys.executable,"tools/callers_of.py","0x000B4780"])
              run("callers-counted-helper",[sys.executable,"tools/callers_of.py","0x000B2610"])
              run("canonical-classes",["git","show","HEAD:targets/game/reverse/canonical_classes.csv"])
              run("audio-ref-headers",["git","grep","-n","-F","AudioEventInfoRef","--","game/**/*.h"],False)
              run("provider-baseline-whole-file",["cmd","/d","/c","build.cmd",provider])
              fence("before-private-sources")
              p=out/"typed-provider.cpp"
              c=out/"typed-consumer.cpp"
              p.write_text("// cl: /DNDEBUG /MD /EHsc /Igame/Libraries/Source/WWVegas/WWLib\n\n// Open-BFME5: thin AudioEventRTS constructors that call outlined initFromName\n// (ILT 0x0004A86D) after the member zeros.\n//   extra       0x000B2D90 101B  (inlined twin 0x000B2CC0)\n//   positional  0x000B2F00 133B  (inlined twin 0x000B2E10)\n//   ObjectID    0x000B4440 141B  (AudioEventInfoRef overload; caller-proven)\n//   DrawableID  0x000B45E0 141B  (inlined twin 0x000B44F0)\n//   LivingWorld 0x000B4780 145B  (AudioEventInfoRef overload; caller-proven)\n\n#include \"ascii_string.h\"\n\n// One-word opaque ABI view. SlowDeathBehavior retains/releases this pointer\n// and the callee helper reads info+8, proving this overload takes an info ref.\nstruct AudioEventInfoRef { void *ptr; };\n\nenum ObjectID\n{\n\tINVALID_ID = 0\n};\n\nenum DrawableID\n{\n\tINVALID_DRAWABLE_ID = 0\n};\n\nenum LivingWorldID\n{\n\tINVALID_LIVING_WORLD_ID = 0\n};\n\nclass CountedPtr\n{\npublic:\n\tCountedPtr() : m_ptr(0) {}\n\t~CountedPtr();\n\n\tvoid *m_ptr;\n};\n\nstruct Coord3D\n{\n\tunsigned int x, y, z;\n};\n\nclass AudioEventRTS\n{\npublic:\n\tAudioEventRTS(const AsciiString &eventName, int extra);\n\tAudioEventRTS(const AsciiString &eventName, const Coord3D *positionOfAudio, int extra);\n\tAudioEventRTS(const AudioEventInfoRef &eventInfo, ObjectID ownerID);\n\tAudioEventRTS(const AsciiString &eventName, DrawableID drawableID);\n\tAudioEventRTS(const AudioEventInfoRef &eventInfo, LivingWorldID ownerID);\n\tvirtual ~AudioEventRTS();\n\tvoid initFromName(const AsciiString &eventName);\n\tvoid resolveOwnerPosition(Coord3D *pos, bool *found);\n\nprivate:\n\tAsciiString m_filenameToLoad;\n\tCountedPtr m_eventInfo;\n\tunsigned int m_playingHandle;\n\tunsigned int m_killThisHandle;\n\tAsciiString m_eventName;\n\tAsciiString m_attackName;\n\tAsciiString m_decayName;\n\tchar m_20[8];\n\tunsigned int m_timeOfDay;\n\tunsigned int m_objectID;\n\tint m_ownerType;\n\tCoord3D m_position;\n\tunsigned char m_flag40;\n\tchar m_41[0x6C - 0x41];\n\tAsciiString m_tail;\n};\n\n// object-symbol=??0AudioEventRTS@@QAE@ABVAsciiString@@H@Z\nAudioEventRTS::AudioEventRTS(const AsciiString &eventName, int extra)\n{\n\tinitFromName(eventName);\n\tm_timeOfDay = static_cast<unsigned int>(extra);\n}\n\n// object-symbol=??0AudioEventRTS@@QAE@ABVAsciiString@@PBUCoord3D@@H@Z\nAudioEventRTS::AudioEventRTS(const AsciiString &eventName, const Coord3D *positionOfAudio, int extra)\n{\n\tinitFromName(eventName);\n\tm_position = *positionOfAudio;\n\tm_ownerType = 0;\n\tm_timeOfDay = static_cast<unsigned int>(extra);\n\tm_flag40 = 1;\n}\n\n// ??0AudioEventRTS@@QAE@ABUAudioEventInfoRef@@W4ObjectID@@@Z\nAudioEventRTS::AudioEventRTS(const AudioEventInfoRef &eventInfo, ObjectID ownerID)\n{\n    // Keep the established helper's source-local spelling and pin. Its argument\n    // is the same one-pointer ref ABI; the helper dereferences it as info+8.\n    initFromName(reinterpret_cast<const AsciiString &>(eventInfo));\n\tm_objectID = ownerID;\n\tm_timeOfDay = 0;\n\tif (ownerID)\n\t\tm_ownerType = 2;\n\telse\n\t\tm_objectID = INVALID_ID;\n\n\tCoord3D pos;\n\tresolveOwnerPosition(&pos, reinterpret_cast<bool *>(\n\t\treinterpret_cast<char *>(&pos) + 0x1C));\n}\n\n// object-symbol=??0AudioEventRTS@@QAE@ABVAsciiString@@W4DrawableID@@@Z\nAudioEventRTS::AudioEventRTS(const AsciiString &eventName, DrawableID drawableID)\n{\n\tinitFromName(eventName);\n\tm_objectID = static_cast<unsigned int>(drawableID);\n\tm_timeOfDay = 0;\n\tif (drawableID)\n\t\tm_ownerType = 1;\n\telse\n\t\tm_objectID = INVALID_ID;\n\n\tCoord3D pos;\n\tresolveOwnerPosition(&pos, reinterpret_cast<bool *>(\n\t\treinterpret_cast<char *>(&pos) + 0x1C));\n}\n\n// ??0AudioEventRTS@@QAE@ABUAudioEventInfoRef@@W4LivingWorldID@@@Z\nAudioEventRTS::AudioEventRTS(const AudioEventInfoRef &eventInfo, LivingWorldID ownerID)\n{\n    // Like the proven ObjectID overload, this helper consumes a counted info ref.\n    initFromName(reinterpret_cast<const AsciiString &>(eventInfo));\n\tm_objectID = static_cast<unsigned int>(ownerID);\n\tm_timeOfDay = 1;\n\tif (ownerID)\n\t\tm_ownerType = 5;\n\telse\n\t\tm_objectID = INVALID_ID;\n\n\tCoord3D pos;\n\tresolveOwnerPosition(&pos, reinterpret_cast<bool *>(\n\t\treinterpret_cast<char *>(&pos) + 0x1C));\n}\n",encoding="utf-8",newline="\n")
              c.write_text("// ?rva0060f3c0@LivingWorldManager@@QAEXXZ\n// Typed counted-info LivingWorld constructor; retail 0x0060F3C0, 184 bytes.\n// cl: /DNDEBUG /DWIN32 /D_WINDOWS /MD /EHsc /Igame/Libraries/Source/WWVegas/WWLib\n#include \"ascii_string.h\"\n\nextern \"C\" __declspec(dllimport) long __stdcall InterlockedDecrement(long volatile *addend);\n\n// Same counted-reference contract used by AudioEventRTSCopyAndLifetime.cpp.\nclass Counted\n{\npublic:\n    virtual ~Counted();\n    void Release_Ref()\n    {\n        if (InterlockedDecrement(&m_refCount) <= 0)\n            delete this;\n    }\n    long m_refCount;\n};\n\nclass CountedPtr\n{\npublic:\n    bool isEmpty() const { return m_ptr == 0; }\n    void clear()\n    {\n        if (m_ptr)\n        {\n            m_ptr->Release_Ref();\n            m_ptr = 0;\n        }\n    }\n    Counted *m_ptr;\n};\n\nenum LivingWorldID { INVALID_LIVING_WORLD_ID = 0 };\n\n// Opaque 112-byte stack record. Its complete cleanup is the existing QAE\n// destructor route at ILT 0x00026F35, rather than the UAE route 0x0002671F.\n// Same existing one-word struct view as AudioEventRTSThinExtraCtor.cpp.\nstruct AudioEventInfoRef { void *ptr; };\n\nclass AudioEventRTS\n{\npublic:\n    AudioEventRTS(const AudioEventInfoRef &infoRef, LivingWorldID owner);\n    ~AudioEventRTS();\nprivate:\n    unsigned char m_storage[0x70];\n};\ntypedef char Rva0060F3C0EventSize[(sizeof(AudioEventRTS) == 0x70) ? 1 : -1];\n\nclass AudioManager\n{\npublic:\n#define SLOT(n) virtual void slot##n();\n    SLOT(00) SLOT(01) SLOT(02) SLOT(03) SLOT(04) SLOT(05) SLOT(06) SLOT(07)\n    SLOT(08) SLOT(09) SLOT(10) SLOT(11) SLOT(12) SLOT(13) SLOT(14) SLOT(15)\n    SLOT(16)\n    virtual unsigned int addAudioEvent(const AudioEventRTS *event);\n#undef SLOT\n};\nextern AudioManager *TheAudio;\n\nstruct Rva0060F3C0LogicSub\n{\n    unsigned char m_padding[0x10];\n    unsigned char m_0010;\n};\nclass LivingWorldLogic\n{\npublic:\n    unsigned char m_padding[0x28];\n    Rva0060F3C0LogicSub *m_0028;\n};\nextern LivingWorldLogic *TheLivingWorldLogic;\n\nclass LivingWorldManager\n{\npublic:\n    void rva0060f3c0();\nprivate:\n    unsigned char m_padding[0x238];\n    CountedPtr m_0238;\n    LivingWorldID m_023C;\n    unsigned char m_padding240[0x54];\n    unsigned char m_0294;\n};\n\nvoid LivingWorldManager::rva0060f3c0()\n{\n    CountedPtr &queued = m_0238;\n    if (m_0238.m_ptr)\n    {\n        AudioEventRTS event(reinterpret_cast<const AudioEventInfoRef &>(queued), m_023C);\n        AudioManager *audio = TheAudio;\n        audio->addAudioEvent(&event);\n        switch (queued.isEmpty())\n        {\n        case false:\n            queued.clear();\n            break;\n        default:\n            break;\n        }\n    }\n    TheLivingWorldLogic->m_0028->m_0010 = 1;\n    m_0294 = 0;\n}\n",encoding="utf-8",newline="\n")
              result["sources"]={p.name:hashlib.sha256(p.read_bytes()).hexdigest(),c.name:hashlib.sha256(c.read_bytes()).hexdigest()}
              fence("before-private-provider")
              provider_probe=run("typed-provider-probe",[sys.executable,"tools/probe.py",str(p),"??0AudioEventRTS@@QAE@ABUAudioEventInfoRef@@W4LivingWorldID@@@Z","0x000B4780","--size","145","--all","--shape"],False)
              result["provider_measurement"]=parse(provider_probe)
              fence("before-private-consumer")
              consumer_probe=run("typed-consumer-probe",[sys.executable,"tools/probe.py",str(c),"?rva0060f3c0@LivingWorldManager@@QAEXXZ","0x0060F3C0","--size","184","--all","--shape"],False)
              result["consumer_measurement"]=parse(consumer_probe)
              fence("after-private-probes")
              run("clean-tree",["git","diff","--exit-code"])
              run("progress",[sys.executable,"tools/progress.py","origin/master"])
              result["status"]="native-typed-overload-probes-complete"
              save()
              print("TYPED_FINAL "+json.dumps(result),flush=True)
          except BaseException as err:
              result.update(status="failed",error=str(err))
              (out/"failure.txt").write_text(traceback.format_exc(),encoding="utf-8")
              save()
              raise
          
          PY
      - name: Preserve selection and narrow native context
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfme1-short-finish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build/short-counted-audio-20261025/
            source/build/experiments/
            source/build/experiments.sqlite
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9
