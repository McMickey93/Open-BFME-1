name: Contributor BFME1 short hard finish
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-short-finish-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-short-hard-finish
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:short-finish-20261025
    steps:
      - name: Read the current official tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the official ledger and read upstream master
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 short-finish
          git fetch --no-tags --depth=128 origin refs/heads/master:refs/remotes/origin/master
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
      - name: Fence the served body and measure its bank with native context
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 short-finish
          python3 -u - <<'PY'
          import csv,hashlib,json,os,subprocess,sys,time,traceback
          from pathlib import Path
          root=Path.cwd().resolve()
          out=root/"build/contributor-short-finish-20261025"
          out.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(root/"tools"))
          import claims
          rva=0x008CF030
          token="1dc25e5be19afcfa220c792369560dc978529019"
          owner="github:McMickey93:bfme1:short-finish-20261025"
          lease="af684acfcd55496eb3f86bd92cddbde4"
          result={"status":"starting","workflow_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"commands":[],"claims":[]}
          def save():
              (out/"context-result.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          def run(label,args,required=True,show=True):
              cp=subprocess.run(args,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(label+".log")).write_bytes(cp.stdout)
              result["commands"].append({"label":label,"argv":list(map(str,args)),"exit_code":cp.returncode,"sha256":hashlib.sha256(cp.stdout).hexdigest()})
              save()
              print("SHORT_COMMAND",label,"exit",cp.returncode,flush=True)
              if show: print(cp.stdout.decode("utf-8","replace"),flush=True)
              if required and cp.returncode: raise RuntimeError(label+" failed")
              return cp.stdout.decode("utf-8","replace")
          def fence(label):
              if not claims.fetch(): raise RuntimeError("Cannot read actual upstream claims")
              entry=claims._read_local().get(rva)
              if not entry: raise RuntimeError("Missing actual claim")
              current,info=entry
              if current!=token or info.get("owner")!=owner or info.get("lease",current)!=lease or info.get("expires",0)<=time.time() or not claims.holds(rva,token): raise RuntimeError("Claim lost before "+label)
              result["claims"].append({"at":label,"token":current,"record":info,"checked_at":time.time()})
              save()
          def guard(path,expected):
              value=subprocess.check_output(["git","hash-object","--",path],cwd=root).decode().strip()
              if value!=expected: raise RuntimeError("Reviewed source changed: "+path)
          try:
              result["source_sha"]=subprocess.check_output(["git","rev-parse","HEAD"],cwd=root).decode().strip()
              if result["source_sha"]!="f633d0e97a953289405438821be0c09b28527bbb": raise RuntimeError("Unexpected official pin")
              guard("AGENTS.md","06b755567bb147dfee3a89f70f7bbcd38410b5b4")
              stash="targets/game/reverse/attempts/0x008cf030.cpp"
              guard(stash,"33b39cf6c43cf6716655582bc9bd040ec4872c70")
              fence("before-context")
              run("selected-brief",[sys.executable,"tools/brief.py","--rvas","0x008CF030"],True)
              run("selected-callees",[sys.executable,"tools/callees.py","0x008CF030","380"])
              run("retail-body",[sys.executable,"tools/dis_retail.py","0x008CF030","396"])
              rows={}
              for name in ("functions.csv","symbols.csv"):
                  p=root/"targets/game/reverse"/name
                  with p.open(encoding="utf-8-sig",newline="") as f:
                      reader=csv.DictReader(f)
                      rows[name]=[row for row in reader if any("008cf030" in str(value).lower() for value in row.values())]
              result["rows"]=rows
              print("SHORT_ROWS "+json.dumps(rows),flush=True)
              history=[]
              for p in sorted((root/"targets/game/reverse/attempt_history/0x008cf030").glob("*.json")):
                  h=json.loads(p.read_text(encoding="utf-8"))
                  history.append({"path":p.relative_to(root).as_posix(),**{k:v for k,v in h.items() if k!="source"}})
              result["bank_history"]=history
              print("SHORT_BANK_HISTORY "+json.dumps(history),flush=True)
              run("narrow-handoff-references",["git","grep","-n","-i","008cf030","--","docs","targets/game/reverse/attempt_support","targets/game/reverse/identity_evidence","targets/game/reverse/re_attempts.log"],False)
              fence("before-private-control-copy")
              control=out/"00-banked-control.cpp"
              control.write_bytes((root/stash).read_bytes())
              result["control_sha256"]=hashlib.sha256(control.read_bytes()).hexdigest()
              fence("before-bank-measurement")
              run("bank-finish-measure",[sys.executable,"tools/finish_measure.py","--one","0x008CF030",str(control)],False)
              fence("before-private-control-probe")
              text=run("bank-probe",[sys.executable,"tools/probe.py",str(control),"?rva8CF030BuildArray@@YAXPAVRva8CF030State@@PAX@Z","0x008CF030","--size","380","--all","--shape"],False)
              result["diagnostic_exact"]="result   EXACT" in text
              fence("after-control")
              run("clean-tree",["git","diff","--exit-code"])
              run("session-progress",[sys.executable,"tools/progress.py","origin/master"])
              result["status"]="control-and-native-context-complete"
              save()
              print("SHORT_FINAL "+json.dumps(result),flush=True)
          except BaseException as err:
              result.update(status="failed",error=str(err))
              (out/"failure.txt").write_text(traceback.format_exc(),encoding="utf-8")
              save()
              raise
          
          PY
      - name: Preserve selection and narrow native context
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfme1-short-finish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/build/contributor-short-finish-20261025/
            source/build/experiments/
            source/build/experiments.sqlite
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9
