                  pool=json.loads(pooltext)["finish"]
                  if not claims.fetch(): raise RuntimeError("Cannot refresh claims before next served suggestion")
                  active={f"0x{rv:08X}" for rv,(tk,info) in claims._read_local().items() if info.get("expires",0)>time.time()}
                  candidates=[c for c in pool if 0<int(c["target_size"])<=512 and c.get("source") and c["target_rva"].upper() not in {"0X00078640","0X003D59C0","0X008CF030"} and c["target_rva"] not in active]
