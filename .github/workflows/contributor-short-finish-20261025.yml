              note="# Counted-info LivingWorld constructor and caller\n\nAt 0x000B4780 (145 bytes), replace the previous semantic claim\nOLD_NAME\nwith the actual distinct counted-reference overload\n??0AudioEventRTS@@QAE@ABUAudioEventInfoRef@@W4LivingWorldID@@@Z.\n\nThis changes the C++ type/identity of an already byte-matched provider.\nIt adds zero new C++ exact bytes. It does not redirect the string-taking\nconstructor at 0x000B4690 or create a constructor alias.\n\n## Independent retail evidence\n\nThe thin provider calls ILT 0x0004A86D to the matched 100-byte helper\n0x000B2610. After commonInit that helper reads its one-word input; if\nnonnull it extracts an AsciiString from pointee+8 and binds the counted\ninfo reference at event+8. The legacy 192-byte constructor 0x000B4690\ninstead assigns the input AsciiString directly and clears event+8.\nThese are semantically different overloads, not exchangeable inline twins.\n\nThe native LivingWorld caller 0x0060F3C0 passes its receiver+0x238 holder\nby reference and the +0x23C owner word through ILT 0x00009250 to B4780.\nAfter the audio virtual call it reloads that holder, calls the imported\nInterlockedDecrement on pointee+4 and calls deleting slot zero if needed.\nThat independently proves counted ownership, rather than AsciiString storage.\nThe provider stores owner to event+0x2C, timeOfDay=1 to +0x28, and ownerType=5\nto +0x30 for a nonzero owner, then returns with RET8.\n\nExisting independent evidence:\n- 0060f3c0-counted-audio.md: full caller extent/ABI, globals and counted release.\n- 000afa60.md: the one-word AudioEventInfoRef and AudioManager producers.\n- 00200df0-instant-death-complete-bank.md: retained-info ObjectID constructor use.\n- AudioEventRTSThinExtraCtor.cpp already declares the ObjectID overload using\n  exactly the same struct AudioEventInfoRef view.\n\nThe only provider source change is the LivingWorld overload's first argument\nand its cast through the existing helper's source-local AsciiString spelling.\nThe helper, CountedPtr contract, all offsets, remaining four constructors and\nthe existing string-taking LivingWorld constructor are unchanged.\n\nThe registry targets/game/reverse/canonical_classes.csv registers no\nAudioEventInfoRef or AudioEventRTS header. The existing one-word struct view\nis retained in the provider and consumer; no shared header/ABI is invented.\nThe consumer keeps an opaque 112-byte event record and the observed complete\nQAE cleanup route at ILT 0x00026F35. It emits no vtable provider.\n\n## Caller recovery\n\nThe existing strong source alternative\n2b3170dba817b184f665e9ace3a7618941e2341012ff2f04eb53ebc11c75b112\nhad six scratch-register differences with a member-pointer constructor route.\nA direct string-taking constructor call had zero masked differences but the\nnormal byte gate correctly rejected its different B4690 callee.\nCorrecting the provider's genuine first argument makes the direct C++ call\nboth uniquely named and correctly routed to B4780.\n\nThe matched Rva003C2530Owner::prepare uses TheLivingWorldManager and calls\nILT 0x00016DEC to 0060F3C0. The member keeps its address-derived spelling\nLivingWorldManager::rva0060f3c0; no guessed playSound name is promoted.\nRET at +0xB7 and INT3 at +0xB8 establish all 184 bytes.\nTheAudio at 0x012ED668 and TheLivingWorldLogic at 0x012F1028 retain canonical\ndata owners; no new global/pin/alias is introduced.\n\n## Native verification and scope\n\nDiagnostic Windows run 40240794015 at official\nf633d0e97a953289405438821be0c09b28527bbb compiled both complete private\nsources: provider145/145B with7relocs and caller184/184B with9relocs, zero\nnonrelocation differences. The prior provider's five bodies passed build.cmd.\nThose diagnostics are not admission: the normal add_match verification and\nscoped builds at the actual source paths decide acceptance.\n\nThe native admission receipt records actual TU-map approval, the EA wb2\nLivingWorldManager.cpp home, current queued fi