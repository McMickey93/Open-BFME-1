name: Daily full byte gate

# tools/gate_baseline.py --check on master, daily: the full gate (every matched
# row byte-verified) that the pre-commit hook runs for a header or shim change,
# and that nothing else runs on master. bytematch.yml is a ten-minute report,
# so a push that turns a row red elsewhere (3ce339fbfa on 2026-10-16 broke
# INIMapCache.cpp's insert_unique rows and nobody saw it until a header commit
# nine days later) stays red until someone's hook refuses their unrelated
# change. This job fails on any red row and uploads the transcript; it records
# and commits nothing. It restores link-census.yml's object cache (same key
# prefix), so a warm run is mostly verification.

on:
  schedule:
    - cron: '23 9 * * *'   # after link-census (04:23 UTC) has saved its objects
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'Open-BFME/Open-BFME-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      BUILD_POOL: '4'
      WINEDEBUG: '-all'
      WINEDLLOVERRIDES: 'mscoree,mshtml='
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r tools/requirements.txt
      - name: Install WineHQ 11 and a prefix
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --install-recommends winehq-stable
          version=$(wine --version)
          echo "$version"
          major=${version#wine-}; major=${major%%.*}
          [ "$major" -ge 11 ] || { echo "need Wine 11 or newer, got $version" >&2; exit 1; }
          echo "WINEPREFIX=$HOME/.wine-bfme" >> "$GITHUB_ENV"
          WINEPREFIX="$HOME/.wine-bfme" wineboot -i
          WINEPREFIX="$HOME/.wine-bfme" wineserver -w
      - name: Key the object cache on the toolchain (link-census.yml's prefix)
        id: cache
        run: echo "prefix=link-census-${{ hashFiles('inputs/toolchains/**') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore compiled objects
        uses: actions/cache/restore@v4
        with:
          path: build/match
          key: ${{ steps.cache.outputs.prefix }}full-gate-${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}
      - name: Full gate (no new red row against full_gate_baseline.txt)
        timeout-minutes: 320
        run: |
          wineserver -p
          python3 tools/gate_baseline.py --check 2>&1 | grep -v '^[0-9a-f]*:fixme:' | tee build/full_gate.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Red rows
        if: failure()
        run: |
          grep -E '^  FAIL |^Functions: |^FULL GATE: ' build/full_gate.log | head -200
      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate
          if-no-files-found: warn
          retention-days: 14
          path: build/full_gate.log
