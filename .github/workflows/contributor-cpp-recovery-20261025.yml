name: Contributor BFME1 C++ recovery
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-cpp-recovery-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-cpp-recovery
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:cpp-recovery-20261025
    steps:
      - name: Read the current official tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the official ledger and read upstream master
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 cpp-recovery
          git fetch --no-tags --depth=128 origin refs/heads/master:refs/remotes/origin/master
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
      - name: Inspect preserved four-byte residues and complete prior records
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 four-byte-inspection
          git switch --detach origin/master
          python3 -u - <<'PY'
          import hashlib,io,json,os,subprocess,sys,urllib.request,zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          build_root=root/"build"
          out=build_root/"contributor-cpp-recovery-20261025"
          out.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(root/"tools"))
          import build,claims,finish_measure,probe
          from experiment_store import validated_object_receipt
          raw=urllib.request.urlopen("https://sdmntprnortheu.oaiusercontent.com/files/00000000-b984-81f4-bdb3-e41980706172/raw?se=2026-10-25T23%3A21%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=01a174d6-c33a-71b9-9ca9-82750df801e0&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T02%3A04%3A00Z&ske=2026-10-26T02%3A04%3A00Z&sks=b&skv=2026-02-06&sig=bXXpSjeMf8WVn7AmNumGwZZsyqPrNbY4TLZXACOg9cA%3D",timeout=60).read()
          assert hashlib.sha256(raw).hexdigest()=="d4698f8804c877541203cee6c3fa8b9100479830e60660cd35fe25e583e5825b"
          archive=zipfile.ZipFile(io.BytesIO(raw))
          for name in archive.namelist():
              target=(build_root/name).resolve()
              assert target.is_relative_to(build_root) and ".." not in Path(name).parts
              if name.endswith("/"): target.mkdir(parents=True,exist_ok=True);continue
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(archive.read(name))
          prior=json.loads((out/"finish-batch.json").read_text(encoding="utf-8"))
          assert prior["base"]=="967c7e1cf5bbda24ea52f802caffa7164c1368ff"
          cache=finish_measure.load()
          wanted={0x00376590,0x005F8010}
          result={"source_run":40242622843,"source_zip_sha256":hashlib.sha256(raw).hexdigest(),"current_base":subprocess.check_output(["git","rev-parse","HEAD"],cwd=root,text=True).strip(),"targets":[]}
          for measurement in prior["measurements"]:
              rva=int(measurement["target_rva"],16)
              if rva not in wanted:continue
              path=root/measurement["stash"]
              raw_source=path.read_bytes()
              assert hashlib.sha256(raw_source).hexdigest()==measurement["whole_source_sha256"]
              entry=finish_measure.current(cache,rva,path)
              symbol=(measurement["entry"].get("symbol") or finish_measure.symbol_of(path))
              objects=[]
              for meta_path in (build_root/"experiments").glob("*/cache.json"):
                  meta=json.loads(meta_path.read_text())
                  obj=meta_path.parent/meta["path"]
                  deps_path=build._deps_sidecar(obj)
                  if not deps_path.exists():continue
                  deps=json.loads(deps_path.read_text())
                  if deps.get("source")!=build._hash_file(str(path)):continue
                  assert hashlib.sha256(obj.read_bytes()).hexdigest()==meta["object"]
                  objects.append(obj)
              assert len(objects)==1, (measurement["stash"],objects)
              compiled,relocs=build.read_object_symbol_bytes(objects[0],symbol)
              retail=build.read_target_bytes(rva,measurement["target_size"])
              R,O,ri,oi,rb,ob,unmapped=probe.diagnostic_streams(retail,bytes(compiled),relocs)
              diffs=[i for i in range(min(len(rb),len(ob))) if rb[i]!=ob[i]]
              residue=[]
              for off in diffs:
                  a=next((ins for ins in ri if ins.address<=off<ins.address+ins.size),None)
                  b=next((ins for ins in oi if ins.address<=off<ins.address+ins.size),None)
                  residue.append({"offset":off,"retail":None if a is None else [a.address,bytes(a.bytes).hex(),a.mnemonic,a.op_str],"object":None if b is None else [b.address,bytes(b.bytes).hex(),b.mnemonic,b.op_str]})
              item={"rva":measurement["target_rva"],"symbol":symbol,"stash":measurement["stash"],"current_qualified":entry is not None,"canonical_entry":measurement["entry"],"current_entry":entry,"residue":residue,"unmapped":unmapped,"retail_hex":retail.hex(),"object_hex":bytes(compiled).hex(),"source":raw_source.decode("utf-8")}
              result["targets"].append(item)
              print("FOUR_BYTE_REST "+json.dumps({k:v for k,v in item.items() if k!="source"}),flush=True)
              records=[]
              tag=f"{rva:08x}"
              with (root/"targets/game/reverse/re_attempts.log").open(encoding="utf-8",errors="replace") as log:
                  for line in log:
                      if tag in line.lower():records.append(line.rstrip("\r\n"))
              (out/(tag+"-complete-prior-records.txt")).write_text("\n".join(records)+"\n",encoding="utf-8")
              print("FOUR_BYTE_PRIOR "+json.dumps({"rva":measurement["target_rva"],"records":records}),flush=True)
              history=root/"targets/game/reverse/attempt_history"/("0x"+tag)
              if history.is_dir():
                  metadata=[]
                  for saved in history.glob("*.json"):
                      data=json.loads(saved.read_text(encoding="utf-8"))
                      metadata.append({k:v for k,v in data.items() if k!="source"})
                  print("FOUR_BYTE_ARCHIVES "+json.dumps({"rva":measurement["target_rva"],"archives":metadata}),flush=True)
          (out/"four-byte-inspection.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          cp=subprocess.run([sys.executable,"tools/brief.py","--rvas","0x00376590","0x005F8010"],cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (out/"four-byte-brief.log").write_bytes(cp.stdout)
          print(cp.stdout.decode("utf-8","replace"),flush=True)
          assert cp.returncode==0
          assert subprocess.run(["git","diff","--exit-code"],cwd=root).returncode==0
          cp=subprocess.run([sys.executable,"tools/progress.py","origin/master"],cwd=root)
          assert cp.returncode==0
          PY
      - name: Preserve native residue inspection and prior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfme1-cpp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/contributor-cpp-recovery-20261025/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9
