name: Contributor BFME1 C++ recovery
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-cpp-recovery-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-cpp-recovery
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:cpp-recovery-20261025
    steps:
      - name: Read the current official tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the official ledger and read upstream master
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 cpp-recovery
          git fetch --no-tags --depth=128 origin refs/heads/master:refs/remotes/origin/master
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
      - name: Inspect whole assigned source and marker exception evidence
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 whole-file-inspection
          git switch --detach origin/master
          python3 -u - <<'PY'
          import csv,hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd().resolve()
          out=root/"build/contributor-cpp-recovery-20261025"
          out.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(root/"tools"))
          import build,claims,eligibility,re_log
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          assert subprocess.check_output(["git","hash-object","AGENTS.md"],text=True).strip()=="06b755567bb147dfee3a89f70f7bbcd38410b5b4"
          def run(label,args,ok=(0,)):
              cp=subprocess.run(args,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              text=cp.stdout.decode("utf-8","replace")
              (out/(label+".log")).write_text(text,encoding="utf-8")
              print("INSPECT "+label+"\n"+text,flush=True)
              assert cp.returncode in ok,(label,cp.returncode)
              return text
          run("claims",[sys.executable,"tools/claims.py","list"])
          rows=eligibility.load_rows()
          opened=eligibility.open_dumps(rows=rows)
          chosen=[r for r in opened if eligibility.rva_of(r)==0x00269780]
          assert len(chosen)==1,"Assigned supported donor lead is no longer eligible"
          source=chosen[0]["source"]
          whole=[r for r in opened if r["source"]==source]
          print("WHOLE_FILE "+json.dumps({"base":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"chosen":chosen[0],"whole_file":whole,"busy":sorted(eligibility.busy_rvas())}),flush=True)
          run("whole-file-brief",[sys.executable,"tools/brief.py","--dump",source,"--limit","1000","--model","gpt-6"])
          run("callees-00269780",[sys.executable,"tools/callees.py","0x00269780","976"],ok=(0,3))
          records={}
          for line in (root/"targets/game/reverse/re_attempts.log").open(encoding="utf-8",errors="replace"):
              for tag in ("00077a90","00269780"):
                  if tag in line.lower():records.setdefault(tag,[]).append(line.rstrip())
          print("ALL_PRIOR_RECORDS "+json.dumps(records),flush=True)
          for r in whole:
              rva=eligibility.rva_of(r)
              tag=f"{rva:08x}"
              found=re_log.stash_for(rva)
              if found:
                  path=found[0]
                  text=path.read_text(encoding="utf-8")
                  print("WHOLE_STASH "+json.dumps({"rva":tag,"path":path.relative_to(root).as_posix(),"score":found[1],"source":text}),flush=True)
              body=build.read_target_bytes(rva,int(r["target_size"]))
              asm="\n".join(f"{i.address:08x} {bytes(i.bytes).hex():20} {i.mnemonic:8} {i.op_str}" for i in Cs(CS_ARCH_X86,CS_MODE_32).disasm(body,rva))
              (out/(tag+"-retail.asm.txt")).write_text(asm,encoding="utf-8")
              print("RETAIL_ASM "+tag+"\n"+asm,flush=True)
          run("support-hits",["git","grep","-n","-i","-E","77a90|269780","--","docs/","targets/game/reverse/identity_evidence/","targets/game/reverse/attempt_support/"],ok=(0,1))
          run("clean",["git","diff","--exit-code"])
          run("progress",[sys.executable,"tools/progress.py","origin/master"])
          PY
      - name: Preserve native residue inspection and prior evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfme1-cpp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/contributor-cpp-recovery-20261025/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9
