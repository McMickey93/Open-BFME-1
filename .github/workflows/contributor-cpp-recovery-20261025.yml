name: Contributor BFME1 C++ recovery
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-cpp-recovery-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-cpp-recovery
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:cpp-recovery-20261025
    steps:
      - name: Read the current official tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: f633d0e97a953289405438821be0c09b28527bbb
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate the official ledger and read upstream master
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 cpp-recovery
          git fetch --no-tags --depth=128 origin refs/heads/master:refs/remotes/origin/master
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
      - name: Inspect uncapped structural and lift recovery queues
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 cpp-recovery
          python3 -u - <<'PY'
          import hashlib,json,os,subprocess,sys,time,traceback
          from pathlib import Path
          root=Path.cwd().resolve()
          out=root/"build/contributor-cpp-recovery-20261025"
          out.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(root/"tools"))
          import claims,list_naked_candidates as naked
          result={"status":"starting","workflow_sha":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"commands":[]}
          def run(label,args,required=True,show=False):
              cp=subprocess.run(args,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (out/(label+".log")).write_bytes(cp.stdout)
              result["commands"].append({"label":label,"argv":list(map(str,args)),"exit_code":cp.returncode,"sha256":hashlib.sha256(cp.stdout).hexdigest()})
              print("RECOVERY_COMMAND",label,"exit",cp.returncode,flush=True)
              if show: print(cp.stdout.decode("utf-8","replace"),flush=True)
              if required and cp.returncode: raise RuntimeError(label+" failed")
              return cp.stdout.decode("utf-8","replace")
          if subprocess.check_output(["git","hash-object","AGENTS.md"],cwd=root).decode().strip()!="06b755567bb147dfee3a89f70f7bbcd38410b5b4": raise RuntimeError("AGENTS changed")
          if not claims.fetch(): raise RuntimeError("Cannot read upstream claims")
          active={f"0x{rva:08X}":{"token":token,**info} for rva,(token,info) in claims._read_local().items() if info.get("expires",0)>time.time()}
          result["active_claims"]=active
          import eligibility,lift_lane,next_work,re_log
          rows=eligibility.load_rows()
          counts=eligibility.attempt_counts()
          latest=eligibility.latest_verdicts()
          open_rows=eligibility.open_dumps(rows=rows,latest=latest,max_size=None)
          stats={}
          for label,test in [("all",lambda n:True),("small",lambda n:n<=512),("large",lambda n:n>512)]:
              subset=[r for r in open_rows if test(int(r["target_size"]))]
              stats[label]={"count":len(subset),"bytes":sum(int(r["target_size"]) for r in subset),"untried":sum(not counts.get(eligibility.rva_of(r),0) for r in subset)}
          result["all_size_statistics"]=stats
          print("RECOVERY_ALL_SIZE_STATS "+json.dumps(stats),flush=True)
          run("naked-help",[sys.executable,"tools/list_naked_candidates.py","--help"],True,True)
          print("RECOVERY_SIZE_CAP list_naked_candidates.MAX_BYTES="+str(naked.MAX_BYTES)+"; no size CLI override. No tool code edited.",flush=True)
          # The structural CLI performs its own current-coverage, boundary and identity filtering.
          structural=json.loads(run("structural-pool",[sys.executable,"tools/next_work.py","--tier","structural","--ranked","--json"]))
          pool=structural["structural"]
          available=[c for c in pool if (c.get("target_rva") or c.get("candidate_rva")) not in active and int(c["size"])>512]
          print("RECOVERY_STRUCTURAL_STATS "+json.dumps({"all":len(pool),"large_available":len(available),"large_untried":sum(not c.get("deferred_attempts") for c in available),"meta":structural["structural_meta"]}),flush=True)
          sequence=[]
          for n in range(min(3,len(available))):
              c=next_work.weighted_choice(available);available.remove(c)
              print("RECOVERY_LARGE_SELECTION "+json.dumps({"order":n,"candidate":c}),flush=True)
              run("large-brief-"+str(n),[sys.executable,"tools/brief.py","--rvas",c.get("target_rva") or c["candidate_rva"]],True,True)
              sequence.append(c)
          result["large_sequence"]=sequence
          # Named lifts have their own positive extent checks; print their served queue.
          run("lift-queue",[sys.executable,"tools/lift_lane.py","--limit","150"],True,True)
          run("clean-tree",["git","diff","--exit-code"])
          run("progress",[sys.executable,"tools/progress.py","origin/master"],True,True)
          result["status"]="served-readonly-all-sizes"
          (out/"result.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          print("RECOVERY_RESULT "+json.dumps(result),flush=True)
          PY
      - name: Preserve selection and narrow native context
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bfme1-cpp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/build/contributor-cpp-recovery-20261025/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9
