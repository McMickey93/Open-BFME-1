name: Native bounded BFME1 linking cleanup
on:
  create:
permissions:
  contents: read
concurrency:
  group: round5-bfme1-20261028-native-3
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.longpaths
  GIT_CONFIG_VALUE_1: 'true'
  GIT_CONFIG_KEY_2: submodule.recurse
  GIT_CONFIG_VALUE_2: 'false'
  PY_PYTHON: '3.12'
  PY_PYTHON3: '3.12'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  BFME_CLAIM_NS: refs/heads/claims/
  BFME_CLAIM_OWNER: 'github:McMickey93:bfme1:round5-20261028'
  BFME_MODEL: OpenAI-Codex
  GIT_TERMINAL_PROMPT: '0'
  GIT_EDITOR: 'true'
  BUILD_POOL: '4'
jobs:
  syntax:
    if: >-
      github.repository == 'McMickey93/Open-BFME-1' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/codex/round5-bfme1-20261028-native-3-control' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/qualification/round5-bfme1-20261028-native-3
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Validate controller syntax
        run: python3 -m py_compile .github/qualification/round5-bfme1-20261028-native-3/native.py
  qualify:
    needs: syntax
    if: >-
      github.repository == 'McMickey93/Open-BFME-1' && github.event.repository.fork == true && github.event.repository.private == false && github.ref == 'refs/heads/codex/round5-bfme1-20261028-native-3-control' && github.event.ref_type == 'branch'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - name: Read immutable controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: McMickey93/Open-BFME-1
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/qualification/round5-bfme1-20261028-native-3
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read pinned official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: 064ec9e008eb77bd0428d3eb51fe34fe60a9d302
          path: source
          persist-credentials: false
          fetch-depth: 256
          submodules: false
      - name: Native qualification and ordinary hooks
        shell: bash
        working-directory: source
        env:
          BFME_TRANSFER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_bash="$BASH"
          [[ "${git_bash,,}" == *.exe ]] || git_bash="${git_bash}.exe"
          export BFME_QUALIFICATION_BASH="$(cygpath -aw "$git_bash")"
          python -u ../control/.github/qualification/round5-bfme1-20261028-native-3/native.py
      - name: Preserve complete native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: round5-bfme1-20261028-native-3-${{ github.run_id }}
          path: round5-evidence/
          if-no-files-found: warn
          retention-days: 14
