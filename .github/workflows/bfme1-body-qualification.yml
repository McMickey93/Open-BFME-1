name: Native BFME1 body experiment

# Manual contributor-fork job. It never publishes code or writes a claim.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfme1-native-body-experiment
  cancel-in-progress: false

jobs:
  experiment:
    if: >-
      github.repository == 'McMickey93/Open-BFME-1' &&
      github.event.repository.fork == true &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read the immutable experiment payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: McMickey93/Open-BFME-1
          ref: ${{ github.sha }}
          path: qualification
          sparse-checkout: |
            .github/qualification/bfme1-body
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          check-latest: false

      - name: Validate the pinned source revision
        id: pin
        shell: bash
        run: python qualification/.github/qualification/bfme1-body/qualify.py --checkout-pin

      - name: Check out the official source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: ${{ steps.pin.outputs.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false

      - name: Run the native experiment and ordinary qualification
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 body-qualification
          git_bash="$BASH"
          [[ "${git_bash,,}" == *.exe ]] || git_bash="${git_bash}.exe"
          export BFME_QUALIFICATION_BASH="$(cygpath -aw "$git_bash")"
          python3 -u ../qualification/.github/qualification/bfme1-body/qualify.py

      - name: Retain logs, object files and exact candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bfme1-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
