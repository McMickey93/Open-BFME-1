name: ByteMatch recovered-source report

on:
  push:
    branches: [master]
    paths:
      - 'game/**'
      - 'targets/game/reverse/functions.csv'
      - 'targets/game/reverse/hatch_baseline.tsv'
      - 'targets/game/reverse/body_guard_baseline.csv'
      - 'targets/game/reverse/full_gate_baseline.txt'
      - 'inputs/baselines/bfme1/retail-1.03-unpacked/**'
      - 'inputs/vendor/**'
      - 'inputs/reference/**'
      - 'tools/**'
      - '.github/workflows/bytematch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bytematch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    if: github.repository == 'Open-BFME/Open-BFME-1' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check progress export invariants
        run: python tools/tests/test_bytematch_report.py
      - name: Export committed recovered source and its provenance
        env:
          BFME_REPORT_COMMIT: ${{ github.sha }}
        run: python tools/bytematch_report.py --expected-commit "$BFME_REPORT_COMMIT"
      # ByteMatch registration needs a repository admin. This artifact is ready
      # for default-branch push ingestion; manual runs also allow inspection.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bfme1-1.03_report
          path: |
            build/bytematch/report.json
            build/bytematch/provenance.json
          if-no-files-found: error
          retention-days: 30
