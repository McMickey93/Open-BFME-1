name: Manual body claims

on:
  workflow_dispatch:
    inputs:
      action:
        description: Claim, renew, or release a bounded set of body reservations
        type: choice
        options: [claim, renew, release]
        required: true
      rvas:
        description: One to five RVAs, such as 0x00123456, separated by spaces
        type: string
        required: true
      seat:
        description: Stable seat name, lowercase letters, digits and hyphens (max 32)
        type: string
        required: true
      tokens:
        description: Renew/release only, JSON mapping canonical RVAs to exact claim commit SHAs
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: manual-claims-${{ github.actor }}
  cancel-in-progress: false

jobs:
  claims:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Open-BFME/Open-BFME-1' && github.ref == 'refs/heads/master' && github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true # ephemeral job token, used only by claims.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the repository's tool requirements
        run: python -m pip install -r tools/requirements.txt
      - name: Enable normal project hooks and check the ledger
        run: |
          bash tools/setup_hooks.sh
          python tools/check_csv.py
      - name: Check the bounded runner with local Git fixtures
        run: python -m pytest tools/tests/test_claim_runner.py -q
      - name: Operate on the requested claim refs
        env:
          CLAIM_ACTION: ${{ inputs.action }}
          CLAIM_RVAS: ${{ inputs.rvas }}
          CLAIM_SEAT: ${{ inputs.seat }}
          CLAIM_TOKENS: ${{ inputs.tokens }}
        run: python tools/claim_runner.py
      - name: Preserve claim tokens and exact run provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bfme1-claims-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/claim_runner/result.json
          if-no-files-found: warn
          retention-days: 7
