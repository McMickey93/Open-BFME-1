name: Contributor native C++ work selection
on:
  push:
    branches: ['contributor/native-cpp-20261025']
    paths: ['.github/workflows/contributor-native-cpp-20261025.yml']
permissions:
  contents: read
concurrency:
  group: mcmickey93-bfme1-cpp-selection
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'McMickey93/Open-BFME-1'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BFME_CLAIM_OWNER: github:McMickey93:bfme1:cpp-20261025
    steps:
      - name: Check out the immutable official revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Open-BFME/Open-BFME-1
          ref: 60145fecd29ec2e21a5cc5796d51c76795296e22
          path: source
          persist-credentials: false
          fetch-depth: 128
          submodules: false
          lfs: false
      - name: Select native Windows Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the official requirements and validate the ledger
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-selection
          python3 -m pip install -r tools/requirements.txt
          python3 tools/check_csv.py
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          git rev-parse HEAD
      - name: Read the selected candidate and its current prerequisites
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-selection
          python3 tools/brief.py --rvas 0x00778590
          python3 tools/callees.py 0x00778590 3986
          python3 tools/repair_queue.py dest 0x00778590
      - name: Inspect ranked C++ reconstruction leads
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-selection
          python3 tools/lift_lane.py --summary
      - name: Inspect current reference transfers
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-reference-selection
          git submodule update --init --depth 1 inputs/reference/open-bfme-2
          git -C inputs/reference/open-bfme-2 fetch --no-tags origin master
          git -C inputs/reference/open-bfme-2 checkout --detach 349db6dc10069cc230469ebf3f6dd6d19a17fb82
          git -C inputs/reference/open-bfme-2 rev-parse HEAD FETCH_HEAD
          python3 tools/bfme2_sweep.py scan --min-size 128
          python3 tools/bfme2_sweep.py ranked --limit 0 > build/reference-ranked.json
          python3 tools/bfme2_sweep.py near --limit 0 > build/reference-near.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('ranked', 'near'):
              data = json.loads(Path('build/reference-' + name + '.json').read_text(encoding='utf-8'))
              opened = [entry for entry in data['entries'] if entry['eligible']]
              print(json.dumps({'lane':name, 'total':data['total'], 'eligible':len(opened), 'entries':opened[:12]}, indent=2))
          PY
      - name: Compile an independent bounded Zero Hour reference sample
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-reference-selection
          python3 tools/zh_sweep.py compile --limit 4
          python3 tools/zh_sweep.py match
          python3 tools/zh_sweep.py packets
      - name: Inspect the complete current leaf candidates and prior verdicts
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-selection
          python3 tools/brief.py --rvas 0x008B0B00 0x003D59C0 0x008B0CF0
      - name: Measure this session against official master
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          source .githooks/python3.sh
          require_python3 contributor-selection
          python3 tools/progress.py origin/master
