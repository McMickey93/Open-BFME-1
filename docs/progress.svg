    <rect class="track" x="28" y="222" width="824" height="14" rx="7"/>
    <rect x="28" y="222" width="233.03" height="14" rx="7" fill="#d29922"/>
    <text x="28" y="256" class="muted" font-size="12.5">2,357,057 / 8,334,501 bytes of the game's own code linked (measured 2026-10-16)</text>
    <text x="28" y="286" class="strong" font-size="15" font-weight="600">Readable names<tspan class="down" dx="10" font-size="13" font-weight="600">▼ 0.02</tspan></text>
